<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>TOURNÉE NY AKO EUROPE 2026 — format 768px</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f4f7fb; color: #1e293b; padding: 12px; min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; }
        
        /* Header polaroid */
        .header-polaroid {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }
        .polaroid-frame {
            background: white;
            padding: 10px 10px 25px 10px;
            border-radius: 8px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            transform: rotate(-1deg);
            max-width: 450px;
            width: 100%;
            margin-bottom: 12px;
        }
        .polaroid-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 4px;
        }
        .polaroid-caption {
            text-align: center;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #2d3748;
            font-size: 1rem;
        }
        h1 { 
            font-size: 1.8rem; 
            font-weight: 800; 
            background: linear-gradient(145deg, #0f2b4b, #1e3a6f); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            letter-spacing: -0.02em;
            text-align: center;
        }
        .subhead { font-size: 0.85rem; color: #5b6e8c; margin-top: 4px; }

        .flags-strip { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 15px 0 5px; }
        .flag-mini { width: 32px; height: 22px; border-radius: 4px; box-shadow: 0 3px 8px rgba(0,0,0,0.1); }

        /* flags simplifiés (mêmes classes) */
        .flag-fr { background: linear-gradient(to right, #002395 33.3%, #fff 33.3%, #fff 66.6%, #ED2939 66.6%); }
        .flag-de { background: linear-gradient(to bottom, #000 33.3%, #DD0000 33.3%, #DD0000 66.6%, #FFCE00 66.6%); }
        .flag-be { background: linear-gradient(to right, #000 33.3%, #FAE042 33.3%, #FAE042 66.6%, #ED2939 66.6%); }
        .flag-ch { background: #D52B1E; position: relative; }
        .flag-ch::before, .flag-ch::after { content:''; position:absolute; background:#fff; }
        .flag-ch::before { width: 18px; height: 4px; top:9px; left:7px; }
        .flag-ch::after { width: 4px; height: 18px; top:2px; left:14px; }
        .flag-uk { background: #012169; position:relative; }
        .flag-uk::before, .flag-uk::after { content:''; position:absolute; background:#fff; }
        .flag-uk::before { width:32px; height:3px; top:9px; left:0; }
        .flag-uk::after { width:3px; height:22px; top:0; left:14px; }
        .flag-wales { background: #fff; position:relative; overflow:hidden; }
        .flag-wales::before { content:''; position:absolute; inset:0; background: linear-gradient(135deg, #fff 50%, #D21034 50%); }
        .flag-mada { background: #fff; position:relative; }
        .flag-mada::before { content:''; position:absolute; left:0; top:0; width:33%; height:100%; background:#FC3D32; }
        .flag-mada::after { content:''; position:absolute; left:0; bottom:0; width:33%; height:50%; background:#007E3A; }

        /* ROW FLEX */
        .top-row { display: flex; flex-direction: column; gap: 20px; margin-bottom: 30px; }

        .calendrier-panel {
            flex: 1 1 auto;
            background: white;
            border-radius: 24px;
            padding: 16px;
            box-shadow: 0 15px 30px -10px rgba(0,50,80,0.15);
            border: 1px solid rgba(0,80,150,0.1);
            min-width: 0; /* évite débordement */
            position: relative;
            overflow: hidden;
        }
        .calendrier-panel::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?ixlib=rb-4.0.3&auto=format&fit=crop&w=2070&q=80');
            background-size: cover; background-position: center 30%;
            opacity: 0.2; pointer-events: none; z-index: 0;
        }
        .calendrier-panel > * { position: relative; z-index: 1; }

        .next-three-panel {
            flex: 1 1 auto;
            background: linear-gradient(145deg, #ffffff, #f2f6fd);
            border-radius: 24px;
            padding: 16px;
            box-shadow: 0 15px 30px -10px rgba(0,55,100,0.15);
            border: 1px solid rgba(0,90,150,0.1);
            min-width: 0;
        }
        .next-three-panel h2 { font-size: 1.3rem; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; color: #163a5f; }

        .calendrier-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .mois-annee { font-weight: 800; font-size: 1.1rem; color: #1e3f64; }
        .btn-nav {
            background: #e7effa; border: none; width: 34px; height: 34px; border-radius: 50%;
            font-size: 1rem; cursor: pointer; color: #255f91; transition: 0.2s;
        }
        .btn-nav:hover { background: #d0e2f5; }

        /* GRILLE CALENDRIER : ajustée pour 768px */
        .calendrier-grille {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
        }
        .jour-nom {
            text-align: center; font-weight: 700; color: #6b7c93;
            font-size: 0.7rem; padding: 4px 0;
        }
        .case-jour {
            background: rgba(255,255,255,0.6); backdrop-filter: blur(2px);
            border-radius: 10px; padding: 4px 1px; min-height: 60px;
            border: 1px solid rgba(255,255,255,0.3); cursor: pointer;
            display: flex; flex-direction: column; align-items: center;
            font-size: 0.6rem; position: relative; overflow: hidden;
        }
        .case-jour:hover { background: rgba(255,255,255,0.85); border-color: #a1c4e5; }
        .case-jour.autre-mois { opacity: 0.2; background: rgba(240,240,240,0.3); }
        .numero-jour { font-weight: 700; font-size: 0.7rem; margin-bottom: 2px; }

        .jour-contenu { display: flex; flex-direction: column; align-items: center; width: 100%; }
        .jour-localite {
            font-weight: 600; color: #166b8f; font-size: 0.55rem;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            max-width: 50px; margin-top: 1px;
        }
        .jour-programme {
            color: #f97316; font-weight: 500; font-size: 0.5rem;
            background: rgba(255,240,229,0.9); border-radius: 6px;
            padding: 1px 4px; margin-top: 2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            max-width: 55px;
        }
        .mini-flag { width: 16px; height: 10px; border-radius: 2px; display: inline-block; margin: 2px auto; }

        /* 3 PROCHAINS CARDS (verticales) */
        .next-cards-vertical { display: flex; flex-direction: column; gap: 10px; }
        .next-card {
            background: #ffffff; border-radius: 18px; padding: 12px;
            box-shadow: 0 5px 12px rgba(0,0,0,0.03); border: 1px solid #d9e5f0;
            cursor: pointer; position: relative; min-width: 0; /* évite débordement */
        }
        .next-date { 
            font-weight: 700; color: #1e5b9c; background: #e2ecfb; 
            padding: 3px 8px; border-radius: 30px; display: inline-block; 
            margin-bottom: 6px; font-size:0.75rem;
        }
        .next-localite { font-weight: 800; font-size: 1rem; color: #0b2b4a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .next-lieu { color: #f15a24; font-weight: 600; font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .j-counter {
            position: absolute; top: 8px; right: 12px;
            background: #f97316; color: white; font-weight: 800; font-size: 0.7rem;
            padding: 3px 8px; border-radius: 30px; border: 2px solid white;
        }

        /* PAYS BLOCS */
        .programs-grid { display: flex; flex-direction: column; gap: 20px; margin: 20px 0; }
        .country-block { 
            background: white; border-radius: 22px; padding: 16px 14px; 
            box-shadow: 0 12px 30px -8px rgba(0,20,40,0.15); border-left: 6px solid; 
        }
        .country-block[data-pays="SUISSE"] { border-left-color: #D52B1E; background: linear-gradient(to right, #fff, #fff5f5); }
        .country-block[data-pays="FRANCE"] { border-left-color: #002395; background: linear-gradient(to right, #fff, #f0f5ff); }
        .country-block[data-pays="ALLEMAGNE"] { border-left-color: #000; background: linear-gradient(to right, #fff, #f5f5f5); }
        .country-block[data-pays="BELGIQUE"] { border-left-color: #FDDA25; background: linear-gradient(to right, #fff, #fffceb); }
        .country-block[data-pays="WALES"] { border-left-color: #D21034; background: linear-gradient(to right, #fff, #fff5f5); }
        .country-block[data-pays="ANGLETERRE"] { border-left-color: #012169; background: linear-gradient(to right, #fff, #eef5ff); }
        .country-block[data-pays="MADAGASCAR"] { border-left-color: #FC3D32; background: linear-gradient(to right, #fff, #fff5f5); }

        .country-header { 
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap; 
            background: rgba(255,255,255,0.7); padding: 8px 12px; border-radius: 40px;
        }
        .country-flag-large { width: 42px; height: 30px; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .country-name { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; color: #0b1f33; display: flex; align-items: center; gap: 5px; }
        .country-emoji { font-size: 1.5rem; }
        .country-stats { margin-left: auto; background: #eef2f6; padding: 4px 14px; border-radius: 40px; font-size: 0.8rem; font-weight: 600; color: #1e3a6f; }

        .toggle-btn {
            background: #2270b0; border: none; border-radius: 40px; padding: 6px 18px;
            font-weight: 700; font-size: 0.8rem; color: white; cursor: pointer;
            display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 10px rgba(30,100,170,0.3);
        }

        /* IMPORTANT : 2 CARTES PAR LIGNE SUR PETITS ÉCRANS */
        .program-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr) !important;
            gap: 12px;
        }

        .program-card {
            border-radius: 18px; padding: 14px; border: 1px solid; cursor: pointer;
            display: flex; flex-direction: column; gap: 6px; min-width: 0; /* évite débordement */
            word-break: break-word;
        }
        .program-card:hover { transform: translateY(-3px); box-shadow: 0 12px 25px -8px rgba(0,55,120,0.2); }
        
        /* Couleurs par pays */
        .country-SUISSE .program-card { background: #fff5f5; border-color: #D52B1E; }
        .country-FRANCE .program-card { background: #f0f5ff; border-color: #002395; }
        .country-ALLEMAGNE .program-card { background: #f5f5f5; border-color: #000; }
        .country-BELGIQUE .program-card { background: #fffceb; border-color: #FDDA25; }
        .country-WALES .program-card { background: #fff5f5; border-color: #D21034; }
        .country-ANGLETERRE .program-card { background: #eef5ff; border-color: #012169; }
        .country-MADAGASCAR .program-card { background: #fff5f5; border-color: #FC3D32; }

        .program-date-badge { 
            display: flex; align-items: center; gap: 4px; font-weight: 700; color: #0a4b7a; 
            background: rgba(255,255,255,0.8); padding: 4px 8px; border-radius: 30px; 
            width: fit-content; font-size: 0.7rem; border: 1px solid #cbd5e0;
        }
        .program-localite { font-weight: 700; font-size: 0.95rem; color: #122b44; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .program-lieu { 
            color: #f15a24; font-weight: 600; font-size: 0.75rem; 
            display: flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.8); 
            padding: 3px 8px; border-radius: 40px; width: fit-content; border: 1px solid #fecaca;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
        }
        .programme-text { 
            font-weight: 600; color: #f97316; font-size: 0.7rem; 
            background: rgba(255,255,255,0.8); padding: 3px 8px; border-radius: 30px; 
            display: inline-block; border: 1px solid #fed7aa; max-width: 100%; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .localisation-link { color: #1e6f9f; font-size: 0.7rem; word-break: break-all; }
        .copy-icon { margin-left: 4px; color: #7e93a8; font-size: 0.6rem; cursor: pointer; }

        footer { margin-top: 40px; text-align: center; color: #8094a8; font-size: 0.75rem; border-top: 1px solid #dce5ed; padding-top: 20px; }

        /* MODAUX inchangés */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; max-width: 600px; width: 90%; border-radius: 28px; padding: 20px; box-shadow: 0 30px 50px rgba(0,0,0,0.3); max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e7edf4; padding-bottom: 12px; margin-bottom: 16px; }
        .modal-header h3 { font-weight: 800; color: #1e293b; font-size: 1.2rem; }
        .close-btn { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #7c8ba0; }

        /* petits ajustements texte */
        @media (max-width: 768px) {
            .country-name { font-size: 1.2rem; }
            .country-stats { font-size: 0.7rem; padding: 4px 8px; }
            .toggle-btn { padding: 5px 12px; font-size: 0.7rem; }
            .program-card { padding: 10px; }
            .program-localite { font-size: 0.85rem; }
            .program-lieu { font-size: 0.7rem; max-width: 100%; }
            .programme-text { font-size: 0.65rem; }
        }
        /* Forcer deux colonnes même en dessous 480 */
        @media (max-width: 480px) {
            .program-list { grid-template-columns: repeat(2, 1fr) !important; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header-polaroid">
        <div class="polaroid-frame">
            <img class="polaroid-img" src="https://drive.google.com/thumbnail?id=193k18u5i7g3JvpQWTK4xFoi7uzJl1vhI&sz=w800" alt="Tournée Europe">
            <div class="polaroid-caption">✨ Toutes nos source sont en TOI✨</div>
        </div>
        <h1>🇪🇺 TOURNÉE NY AKO EUROPE 2026</h1>
        <div class="subhead">Tous les programmes ouverts • mise à jour auto</div>
        <div class="flags-strip">
            <div class="flag-mini flag-ch" title="Suisse"></div>
            <div class="flag-mini flag-fr" title="France"></div>
            <div class="flag-mini flag-de" title="Allemagne"></div>
            <div class="flag-mini flag-be" title="Belgique"></div>
            <div class="flag-mini flag-uk" title="Angleterre"></div>
            <div class="flag-mini flag-wales" title="Wales"></div>
            <div class="flag-mini flag-mada" title="Madagascar"></div>
        </div>
    </div>

    <div class="top-row">
        <div class="calendrier-panel">
            <div class="calendrier-header">
                <button class="btn-nav" id="prevMonthBtn"><i class="fas fa-chevron-left"></i></button>
                <span class="mois-annee" id="moisAnnee">Avril 2026</span>
                <button class="btn-nav" id="nextMonthBtn"><i class="fas fa-chevron-right"></i></button>
            </div>
            <div class="calendrier-grille" id="calendrierGrille"></div>
        </div>

        <div class="next-three-panel" id="nextThreePanel">
            <h2><i class="fas fa-hourglass-half"></i> 3 programmes les plus proches</h2>
            <div id="nextCardsContainer" class="next-cards-vertical"></div>
        </div>
    </div>

    <div id="programmesPublic" class="programs-grid"></div>

    <footer><i class="fas fa-music"></i> Données extraites automatiquement · version 768px</footer>
</div>

<!-- MODAL MULTI-PROGRAMMES -->
<div id="dateProgramsModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalDateTitle">Programmes du <span id="modalDateDay"></span></h3>
            <button class="close-btn" onclick="closeDateModal()"><i class="fas fa-times"></i></button>
        </div>
        <div id="modalProgramsList"></div>
    </div>
</div>

<!-- MODAL DÉTAIL -->
<div id="programDetailModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="detailModalTitle">Détail du programme</h3>
            <button class="close-btn" onclick="closeDetailModal()"><i class="fas fa-times"></i></button>
        </div>
        <div id="detailModalBody"></div>
    </div>
</div>

<script>
(function() {
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSrF0hs00W-QvR3v5wxZA1ceGEx4xWR0dJv5kF3zgab6YVV00OehcwxYg-EJfOrMqj4IJnDl649SIkg/pub?gid=951917006&single=true&output=csv';
    const EXCLUDED_KEYWORDS = ['apéro','apero','repas','installation','visite','visites','repos','trajet','trajets','départ','retour','rest','relax','marche','shopping','marché','détente','voyage','transfert'];
    const COUNTRY_FLAG_CLASS = { 'SUISSE':'flag-ch','FRANCE':'flag-fr','ALLEMAGNE':'flag-de','BELGIQUE':'flag-be','WALES':'flag-wales','ANGLETERRE':'flag-uk','MADAGASCAR':'flag-mada' };
    const COUNTRY_EMOJI = { 'SUISSE': '🇨🇭', 'FRANCE': '🇫🇷', 'ALLEMAGNE': '🇩🇪', 'BELGIQUE': '🇧🇪', 'WALES': '🏴󠁧󠁢󠁷󠁬󠁳󠁿', 'ANGLETERRE': '🏴󠁧󠁢󠁥󠁮󠁧󠁿', 'MADAGASCAR': '🇲🇬' };
    const COLUMNS = { DATE:0, LOCALITE:1, LIEU:2, HEURES:3, ADRESSE:4, HEBERGEMENT:5, PROGRAMME:6, LOCALISATION:7, SITE:8, PAYS:9, COORDS:10, TRAJETS:11 };

    let allData = [];
    let programsByCountry = {};
    let uniqueCountries = [];
    let flatPrograms = [];
    let countryByDate = new Map();

    let today = new Date(); 
    today.setHours(0,0,0,0);
    
    let currentCalMonth = new Date(today.getFullYear(), today.getMonth(), 1);
    const startDate = new Date(2026, 3, 1);
    if (currentCalMonth < startDate) { currentCalMonth = new Date(2026, 3, 1); }

    function parseCSV(text) {
        const lines = []; let cur=[], field='', inQuotes=false;
        for (let i=0; i<text.length; i++) {
            let c = text[i];
            if (c === '"' && !inQuotes) { inQuotes=true; continue; }
            if (c === '"' && inQuotes && text[i+1]==='"') { field+='"'; i++; continue; }
            if (c === '"' && inQuotes) { inQuotes=false; continue; }
            if (c === ',' && !inQuotes) { cur.push(field); field=''; continue; }
            if ((c === '\n' || c === '\r') && !inQuotes) {
                if (c === '\r' && text[i+1]==='\n') i++;
                if (field || cur.length) { cur.push(field); lines.push(cur); }
                cur = []; field = '';
                continue;
            }
            field += c;
        }
        if (field || cur.length) { cur.push(field); lines.push(cur); }
        return lines;
    }
    
    function parseDate(s) {
        if (!s) return null;
        let parts = s.split(/[/\-.]/);
        if (parts.length===3) {
            let d = parseInt(parts[0],10), m = parseInt(parts[1],10)-1, y = parseInt(parts[2],10);
            if (y<100) y+=2000;
            return new Date(y,m,d);
        }
        let d = new Date(s);
        return isNaN(d) ? null : d;
    }
    
    function formatDateFr(d) {
        if (!d) return '';
        let dd = d.getDate().toString().padStart(2,'0');
        let mm = (d.getMonth()+1).toString().padStart(2,'0');
        let yy = d.getFullYear().toString().slice(-2);
        return `${dd}/${mm}/${yy}`;
    }
    
    function getEmoji(p) {
        if (!p) return '📋';
        let low = p.toLowerCase();
        if (low.includes('concert')) return '🎤';
        if (low.includes('animation')||low.includes('jeux')) return '🎪';
        if (low.includes('culte')||low.includes('eglise')) return '⛪';
        if (low.includes('rencontre')) return '🤝';
        return '📋';
    }
    
    function isExcluded(prog, lieu) {
        let txt = (prog+' '+(lieu||'')).toLowerCase();
        return EXCLUDED_KEYWORDS.some(k => txt.includes(k));
    }
    
    function getProgramDisplay(prog, loc, lieu) {
        if (prog && prog.trim()!=='' && !isExcluded(prog, lieu)) return prog.trim();
        if ((loc&&loc.trim()!=='') || (lieu&&lieu.trim()!=='')) return "Programme";
        return null;
    }
    
    function isPastProgram(prog) { return prog.date < today; }
    
    function daysUntil(date) {
        const diff = date - today;
        return Math.ceil(diff / (1000 * 60 * 60 * 24));
    }

    async function loadData() {
        const urls = [ SHEET_URL, 'https://api.allorigins.win/raw?url='+encodeURIComponent(SHEET_URL), 'https://corsproxy.io/?'+encodeURIComponent(SHEET_URL) ];
        let csvText = null;
        for (let url of urls) {
            try { let r = await fetch(url, {cache:'no-store'}); if (r.ok) { csvText = await r.text(); break; } } catch(e) {}
        }
        if (!csvText) throw new Error('Impossible de charger');
        let rows = parseCSV(csvText);
        if (rows.length<5) throw new Error('Format CSV invalide');
        allData = rows.slice(4).filter(r => r.length>=10 && r[COLUMNS.DATE] && r[COLUMNS.PAYS]);
        buildData();
        renderCalendrier(currentCalMonth);
        renderNextThree();
        renderCountries();
    }

    function buildData() {
        programsByCountry = {};
        flatPrograms = [];
        countryByDate.clear();

        allData.forEach(row => {
            let pays = (row[COLUMNS.PAYS]||'').trim().toUpperCase();
            if (!pays) return;
            let loc = row[COLUMNS.LOCALITE]||'';
            if (loc.toUpperCase().includes('RETOUR MADAGASCAR')) return;
            let progRaw = row[COLUMNS.PROGRAMME]||'';
            let lieu = row[COLUMNS.LIEU]||'';
            let progDisplay = getProgramDisplay(progRaw, loc, lieu);
            if (!progDisplay) return;
            if (isExcluded(progRaw, lieu)) return;
            let date = parseDate(row[COLUMNS.DATE]);
            if (!date) return;

            let dateKey = date.toISOString().split('T')[0];
            if (!countryByDate.has(dateKey)) { countryByDate.set(dateKey, pays); }

            let item = {
                date, dateStr: formatDateFr(date),
                localite: loc, lieu, heures: row[COLUMNS.HEURES]||'',
                programme: progDisplay,
                adresse: row[COLUMNS.ADRESSE]||'',
                localisation: row[COLUMNS.LOCALISATION]||'',
                site: row[COLUMNS.SITE]||'',
                coords: row[COLUMNS.COORDS]||'',
                pays
            };
            if (!programsByCountry[pays]) programsByCountry[pays] = [];
            programsByCountry[pays].push(item);
            flatPrograms.push(item);
        });

        for (let p in programsByCountry) { programsByCountry[p].sort((a,b)=>a.date-b.date); }
        flatPrograms.sort((a,b)=>a.date-b.date);
        const order = ['SUISSE','FRANCE','ALLEMAGNE','BELGIQUE','WALES','ANGLETERRE','MADAGASCAR'];
        uniqueCountries = order.filter(c => programsByCountry[c] && programsByCountry[c].length>0);
    }

    function renderCalendrier(date) {
        let mois = date.getMonth(), an = date.getFullYear();
        document.getElementById('moisAnnee').innerText = date.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
        let premier = new Date(an, mois, 1);
        let dernier = new Date(an, mois+1, 0);
        let debutSem = premier.getDay();
        if (debutSem===0) debutSem=7;
        let joursPrev = debutSem-1;

        let html = '<div class="jour-nom">L</div><div class="jour-nom">M</div><div class="jour-nom">M</div><div class="jour-nom">J</div><div class="jour-nom">V</div><div class="jour-nom">S</div><div class="jour-nom">D</div>';

        let prevMonth = new Date(an, mois, 0);
        let prevDays = prevMonth.getDate();
        for (let i=0; i<joursPrev; i++) {
            let jour = prevDays - joursPrev + i + 1;
            html += `<div class="case-jour autre-mois"><span class="numero-jour">${jour}</span></div>`;
        }

        for (let d=1; d<=dernier.getDate(); d++) {
            let curDate = new Date(an, mois, d);
            let programmesDuJour = flatPrograms.filter(p => p.date.toDateString() === curDate.toDateString() && !isPastProgram(p));
            let paysDuJour = null;
            if (programmesDuJour.length>0) { paysDuJour = programmesDuJour[0].pays; } 
            else if (countryByDate.has(curDate.toISOString().split('T')[0])) { paysDuJour = countryByDate.get(curDate.toISOString().split('T')[0]); }

            let flagHtml = paysDuJour ? `<div class="mini-flag ${COUNTRY_FLAG_CLASS[paysDuJour]||'flag-fr'}"></div>` : '';
            let localite = programmesDuJour.length>0 ? programmesDuJour[0].localite : '';
            let progText = programmesDuJour.length>0 ? (programmesDuJour.length>1 ? `${programmesDuJour.length} prog.` : programmesDuJour[0].programme) : '';

            html += `<div class="case-jour" onclick="showProgramsForDate('${curDate}')">`;
            html += `<span class="numero-jour">${d}</span>`;
            if (paysDuJour) {
                html += `<div class="jour-contenu">`;
                html += flagHtml;
                if (localite) html += `<div class="jour-localite">${localite.substring(0,10)}</div>`;
                if (progText) html += `<div class="jour-programme">${progText.substring(0,10)}</div>`;
                html += `</div>`;
            }
            html += `</div>`;
        }

        let totalCases = joursPrev + dernier.getDate();
        let reste = 42 - totalCases;
        for (let i=1; i<=reste; i++) {
            html += `<div class="case-jour autre-mois"><span class="numero-jour">${i}</span></div>`;
        }
        document.getElementById('calendrierGrille').innerHTML = html;
    }

    window.showProgramsForDate = function(dateStr) {
        let d = new Date(dateStr);
        let programmes = flatPrograms.filter(p => p.date.toDateString()===d.toDateString() && !isPastProgram(p));
        let modal = document.getElementById('dateProgramsModal');
        document.getElementById('modalDateDay').innerText = d.toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'});

        let listDiv = document.getElementById('modalProgramsList');
        listDiv.innerHTML = '';

        if (programmes.length===0) {
            let dateKey = d.toISOString().split('T')[0];
            if (countryByDate.has(dateKey)) {
                listDiv.innerHTML = `<div style="padding:20px; text-align:center;">Aucun programme public, mais le groupe est en ${countryByDate.get(dateKey)}</div>`;
            } else {
                listDiv.innerHTML = '<div style="padding:20px; text-align:center;">Aucun programme public ce jour</div>';
            }
        } else {
            programmes.forEach(p => {
                let card = document.createElement('div');
                card.className = 'modal-program-card';
                card.onclick = () => { closeDateModal(); openDetailModal(p); };
                let locLine = '';
                if (p.localisation && p.localisation.trim() !== '') {
                    let shortLoc = p.localisation.length > 40 ? p.localisation.substring(0,40)+'…' : p.localisation;
                    locLine = `<div class="modal-loc"><i class="fas fa-map"></i> ${shortLoc}</div>`;
                } else if (p.coords && p.coords.trim() !== '') {
                    let m = p.coords.match(/([-+]?\d+\.\d+)[,\s]+([-+]?\d+\.\d+)/);
                    if (m) {
                        locLine = `<div class="modal-loc"><i class="fas fa-map-marker-alt"></i> ${m[1].substring(0,6)}…, ${m[2].substring(0,6)}…</div>`;
                    }
                }
                card.innerHTML = `
                    <div style="font-weight:700; color:#0a4b7a;">${p.heures ? p.heures : 'horaire ?'}</div>
                    <div style="font-weight:600;">📍 ${p.localite}</div>
                    ${locLine}
                    <div style="margin-top:6px;"><span class="programme-text">${getEmoji(p.programme)} ${p.programme}</span></div>
                `;
                listDiv.appendChild(card);
            });
        }
        modal.style.display = 'flex';
    };

    window.closeDateModal = function() { document.getElementById('dateProgramsModal').style.display = 'none'; };
    window.closeDetailModal = function() { document.getElementById('programDetailModal').style.display = 'none'; };

    window.openDetailModal = function(p) {
        let modal = document.getElementById('programDetailModal');
        document.getElementById('detailModalTitle').innerText = p.localite + ' · ' + p.pays;
        let body = document.getElementById('detailModalBody');
        let locHtml = '';
        if (p.localisation) locHtml = `<div class="modal-detail-row"><span class="modal-icon">🔗</span><span class="modal-info">${p.localisation}</span></div>`;
        else if (p.coords) {
            let m = p.coords.match(/([-+]?\d+\.\d+)[,\s]+([-+]?\d+\.\d+)/);
            if (m) { locHtml = `<div class="modal-detail-row"><span class="modal-icon">🗺️</span><span class="modal-info"><a href="https://www.google.com/maps?q=${m[1]},${m[2]}" target="_blank">Google Maps</a><br><small>${m[1]}, ${m[2]}</small></span></div>`; }
        }
        let siteHtml = p.site ? `<div class="modal-detail-row"><span class="modal-icon">🌐</span><span class="modal-info">${p.site}</span></div>` : '';
        body.innerHTML = `
            <div class="modal-detail-row"><span class="modal-icon">📅</span><span class="modal-info">${p.dateStr} · ${p.heures || 'horaire ?'}</span></div>
            <div class="modal-detail-row"><span class="modal-icon">🏷️</span><span class="modal-info"><strong>${p.programme}</strong></span></div>
            <div class="modal-detail-row"><span class="modal-icon">📍</span><span class="modal-info"><strong>${p.lieu || 'Lieu non précisé'}</strong>${p.adresse ? '<br>'+p.adresse : ''}</span></div>
            ${locHtml} ${siteHtml} <hr> <div class="modal-detail-row"><span class="modal-icon">ℹ️</span><span class="modal-info">Événement public</span></div>
        `;
        modal.style.display = 'flex';
    };

    document.getElementById('prevMonthBtn').addEventListener('click', ()=>{ currentCalMonth.setMonth(currentCalMonth.getMonth()-1); renderCalendrier(currentCalMonth); });
    document.getElementById('nextMonthBtn').addEventListener('click', ()=>{ currentCalMonth.setMonth(currentCalMonth.getMonth()+1); renderCalendrier(currentCalMonth); });

    function renderNextThree() {
        let upcoming = flatPrograms.filter(p => !isPastProgram(p)).slice(0,3);
        let container = document.getElementById('nextCardsContainer');
        let panel = document.getElementById('nextThreePanel');
        if (upcoming.length===0) { panel.style.display='none'; return; }
        panel.style.display='block';
        container.innerHTML = '';
        upcoming.forEach(p => {
            let card = document.createElement('div');
            card.className = 'next-card';
            card.onclick = ()=>openDetailModal(p);
            let jours = daysUntil(p.date);
            let jourText = jours === 0 ? "Aujourd'hui" : jours === 1 ? "Demain" : `J-${jours}`;
            let locDisplay = p.lieu || 'Lieu à préciser';
            card.innerHTML = `
                <div class="j-counter">${jourText}</div>
                <div class="next-date">📅 ${p.dateStr} · ${p.heures || ''}</div>
                <div class="next-localite">📍 ${p.localite||'?'}</div>
                <div class="next-lieu">${locDisplay}</div>
                <div style="margin-top:6px;"><span class="programme-text">${getEmoji(p.programme)} ${p.programme}</span></div>
            `;
            container.appendChild(card);
        });
    }

    function renderCountries() {
        let container = document.getElementById('programmesPublic');
        if (!container) return;
        if (uniqueCountries.length===0) { container.innerHTML = '<div style="padding:40px; text-align:center;">Aucun programme à venir.</div>'; return; }

        let html = '';
        uniqueCountries.forEach(pays => {
            let programmes = programsByCountry[pays].filter(p => !isPastProgram(p));
            if (programmes.length===0) return;
            let flagClass = COUNTRY_FLAG_CLASS[pays]||'flag-fr';
            let paysDisplay = pays.charAt(0)+pays.slice(1).toLowerCase();
            let emoji = COUNTRY_EMOJI[pays] || '🇪🇺';

            html += `<div class="country-block" data-pays="${pays}" id="block-${pays}">`;
            html += `<div class="country-header">`;
            html += `<div class="country-flag-large ${flagClass}"></div>`;
            html += `<span class="country-name"><span class="country-emoji">${emoji}</span> ${paysDisplay}</span>`;
            html += `<span class="country-stats"><i class="far fa-calendar-alt"></i> ${programmes.length} prog.</span>`;
            html += `<button class="toggle-btn" onclick="toggleCountry('${pays}')" id="toggle-${pays}"><i class="fas fa-eye"></i> Afficher</button>`;
            html += `</div>`;
            html += `<div class="program-list" id="list-${pays}" style="display: none;">`;
            programmes.forEach(p => {
                let emojiProg = getEmoji(p.programme);
                let lieuAffiche = p.lieu || p.localisation || 'Lieu à préciser';
                if (lieuAffiche.length>30) lieuAffiche = lieuAffiche.slice(0,27)+'…';
                html += `<div class="program-card" onclick='openDetailModal(${JSON.stringify(p).replace(/'/g,"\\'").replace(/"/g,"&quot;")})'>`;
                html += `<div class="program-date-badge"><i class="far fa-calendar"></i> ${p.dateStr} ${p.heures ? '· '+p.heures.substring(0,5) : ''}</div>`;
                html += `<div class="program-localite"><i class="fas fa-map-pin"></i> ${p.localite||'?'}</div>`;
                if (p.lieu) html += `<div class="program-lieu"><i class="fas fa-location-dot"></i> ${lieuAffiche}</div>`;
                html += `<div><span class="programme-text">${emojiProg} ${p.programme.substring(0,20)}${p.programme.length>20?'…':''}</span></div>`;
                html += `</div>`;
            });
            html += `</div></div>`;
        });
        container.innerHTML = html;
    }

    window.toggleCountry = function(pays) {
        let list = document.getElementById('list-'+pays);
        let btn = document.getElementById('toggle-'+pays);
        if (!list || !btn) return;
        if (list.style.display === 'none' || list.style.display === '') {
            list.style.display = 'grid';
            btn.innerHTML = '<i class="fas fa-eye-slash"></i> Masquer';
        } else {
            list.style.display = 'none';
            btn.innerHTML = '<i class="fas fa-eye"></i> Afficher';
        }
    };

    window.copyText = function(text, ev) { ev.stopPropagation(); navigator.clipboard.writeText(text).then(()=>alert('📋 Copié!')); };
    window.onclick = function(e) { if (e.target.classList.contains('modal')) e.target.style.display = 'none'; };

    loadData();
})();
</script>
</body>
