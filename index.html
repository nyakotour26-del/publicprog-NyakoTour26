<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>TOURNÉE NY AKO EUROPE 2026</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f4f7fb; color: #1e293b; padding: 16px; min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; }
        
        /* Header avec photo style polaroid */
        .header-polaroid {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }
        .polaroid-frame {
            background: white;
            padding: 12px 12px 30px 12px;
            border-radius: 8px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2), 0 0 0 1px rgba(255,255,255,0.5), inset 0 0 0 1px rgba(0,0,0,0.1);
            transform: rotate(-1deg);
            max-width: 500px;
            width: 100%;
            margin-bottom: 15px;
            transition: transform 0.3s;
        }
        .polaroid-frame:hover {
            transform: rotate(0.5deg) translateY(-5px);
        }
        .polaroid-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 4px;
            display: block;
        }
        .polaroid-caption {
            text-align: center;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #2d3748;
            font-size: 1.2rem;
        }
        h1 { 
            font-size: 2.2rem; 
            font-weight: 800; 
            background: linear-gradient(145deg, #0f2b4b, #1e3a6f); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            letter-spacing: -0.02em;
            margin-top: 5px;
        }
        .subhead { font-size: 1rem; color: #5b6e8c; margin-top: 6px; }

        .flags-strip { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 20px 0 10px; }
        .flag-mini { width: 36px; height: 24px; border-radius: 4px; box-shadow: 0 3px 8px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .flag-mini:hover { transform: scale(1.1); }
        .flag-fr { background: linear-gradient(90deg, #002395 33.33%, #fff 33.33%, #fff 66.66%, #ED2939 66.66%); }
        .flag-de { background: linear-gradient(0deg, #000 33.33%, #DD0000 33.33%, #DD0000 66.66%, #FFCE00 66.66%); }
        .flag-be { background: linear-gradient(90deg, #000 33.33%, #FAE042 33.33%, #FAE042 66.66%, #ED2939 66.66%); }
        .flag-ch { 
            background: #D52B1E; 
            position: relative; 
            overflow: hidden;
        }
        .flag-ch::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60%;
            height: 20%;
            background: white;
        }
        .flag-ch::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20%;
            height: 60%;
            background: white;
        }
        .flag-uk { 
            background: #012169; 
            position: relative;
            background-image: 
                linear-gradient(45deg, #fff 25%, transparent 25%),
                linear-gradient(-45deg, #fff 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #fff 75%),
                linear-gradient(-45deg, transparent 75%, #fff 75%);
            background-size: 12px 12px;
            background-position: 0 0, 0 6px, 6px -6px, -6px 0px;
        }
        .flag-uk::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 20%;
            background: #fff;
            transform: translateY(-50%);
            z-index: 1;
        }
        .flag-uk::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            bottom: 0;
            width: 20%;
            background: #fff;
            transform: translateX(-50%);
            z-index: 1;
        }
        .flag-wales { 
            background: #fff; 
            position: relative; 
            overflow: hidden;
        }
        .flag-wales::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #fff 50%, #D21034 50%);
        }
        .flag-wales::after {
            content: '🐉';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            color: #D21034;
            text-shadow: 0 0 2px #fff;
            z-index: 2;
        }
        .flag-mada { 
            background: #fff; 
            position: relative;
            overflow: hidden;
        }
        .flag-mada::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 33.33%;
            height: 100%;
            background: #FC3D32;
        }
        .flag-mada::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 33.33%;
            height: 50%;
            background: #007E3A;
        }

        /* DISPOSITION RESPONSIVE : côte à côte à partir de 900px */
        .top-row { display: flex; flex-direction: column; gap: 24px; margin-bottom: 30px; }
        @media (min-width: 900px) { .top-row { flex-direction: row; } }

        .calendrier-panel {
            flex: 1 1 50%;
            background: white;
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 15px 30px -10px rgba(0,50,80,0.15);
            border: 1px solid rgba(0,80,150,0.1);
            min-width: 280px;
            position: relative;
            overflow: hidden;
        }
        .calendrier-panel::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?ixlib=rb-4.0.3&auto=format&fit=crop&w=2070&q=80');
            background-size: cover;
            background-position: center 30%;
            opacity: 0.25;
            pointer-events: none;
            z-index: 0;
        }
        .calendrier-panel > * { position: relative; z-index: 1; }

        .next-three-panel {
            flex: 1 1 40%;
            background: linear-gradient(145deg, #ffffff, #f2f6fd);
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 15px 30px -10px rgba(0,55,100,0.15);
            border: 1px solid rgba(0,90,150,0.1);
            min-width: 280px;
        }
        .next-three-panel h2 { 
            font-size: 1.4rem; 
            margin-bottom: 16px; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            color: #163a5f; 
        }

        .calendrier-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .mois-annee { font-weight: 800; font-size: 1.3rem; color: #1e3f64; }
        .btn-nav {
            background: #e7effa;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            color: #255f91;
            transition: 0.2s;
        }
        .btn-nav:hover { background: #d0e2f5; }
        .calendrier-grille {
            display: grid;
            grid-template-columns: repeat(7,1fr);
            gap: 6px;
        }
        .jour-nom {
            text-align: center;
            font-weight: 700;
            color: #6b7c93;
            font-size: 0.8rem;
            padding: 6px 0;
        }
        .case-jour {
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(2px);
            border-radius: 16px;
            padding: 8px 4px;
            min-height: 80px;
            border: 1px solid rgba(255,255,255,0.3);
            transition: 0.1s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.7rem;
            position: relative;
        }
        .case-jour:hover { background: rgba(255,255,255,0.85); border-color: #a1c4e5; }
        .case-jour.autre-mois { opacity: 0.3; background: rgba(240,240,240,0.3); }
        .numero-jour { font-weight: 700; font-size: 0.85rem; margin-bottom: 2px; }

        .jour-localite {
            font-weight: 600;
            color: #166b8f;
            font-size: 0.65rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80px;
            margin-top: 2px;
        }
        .jour-programme {
            color: #f97316;
            font-weight: 500;
            font-size: 0.6rem;
            background: rgba(255,240,229,0.9);
            border-radius: 10px;
            padding: 2px 6px;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80px;
        }
        .mini-flag { width: 18px; height: 12px; border-radius: 2px; display: inline-block; margin: 2px auto; }

        /* 3 prochains cards (vertical) */
        .next-cards-vertical { display: flex; flex-direction: column; gap: 14px; }
        .next-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 5px 12px rgba(0,0,0,0.03);
            border: 1px solid #d9e5f0;
            transition: 0.15s;
            cursor: pointer;
            position: relative;
        }
        .next-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,90,150,0.1); background: #fafdff; }
        .next-date { 
            font-weight: 700; 
            color: #1e5b9c; 
            background: #e2ecfb; 
            padding: 4px 10px; 
            border-radius: 30px; 
            display: inline-block; 
            margin-bottom: 8px; 
            font-size:0.85rem;
        }
        .next-localite { 
            font-weight: 800; 
            font-size: 1.1rem; 
            color: #0b2b4a;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .next-lieu { color: #f15a24; font-weight: 600; font-size: 0.85rem; }
        .next-flag { width: 22px; height: 14px; border-radius: 3px; display: inline-block; }
        
        /* Compteur J-xxx */
        .j-counter {
            position: absolute;
            top: 12px;
            right: 16px;
            background: #f97316;
            color: white;
            font-weight: 800;
            font-size: 0.9rem;
            padding: 4px 12px;
            border-radius: 30px;
            box-shadow: 0 2px 8px rgba(249,115,22,0.3);
            border: 2px solid white;
        }

        /* pays blocks avec couleurs et emojis personnalisés */
        .programs-grid { display: flex; flex-direction: column; gap: 24px; margin: 30px 0; }
        .country-block { 
            background: white; 
            border-radius: 24px; 
            padding: 20px 18px; 
            box-shadow: 0 12px 30px -8px rgba(0,20,40,0.15); 
            border-left: 6px solid; 
            transition: transform 0.2s;
        }
        .country-block:hover { transform: translateY(-3px); }
        .country-block[data-pays="SUISSE"] { border-left-color: #D52B1E; background: linear-gradient(to right, #fff, #fff5f5); }
        .country-block[data-pays="FRANCE"] { border-left-color: #002395; background: linear-gradient(to right, #fff, #f0f5ff); }
        .country-block[data-pays="ALLEMAGNE"] { border-left-color: #000; background: linear-gradient(to right, #fff, #f5f5f5); }
        .country-block[data-pays="BELGIQUE"] { border-left-color: #FDDA25; background: linear-gradient(to right, #fff, #fffceb); }
        .country-block[data-pays="WALES"] { border-left-color: #00A859; background: linear-gradient(to right, #fff, #f0fff0); }
        .country-block[data-pays="ANGLETERRE"] { border-left-color: #012169; background: linear-gradient(to right, #fff, #eef5ff); }
        .country-block[data-pays="MADAGASCAR"] { border-left-color: #FC3D32; background: linear-gradient(to right, #fff, #fff5f5); }

        .country-header { 
            display: flex; 
            align-items: center; 
            gap: 16px; 
            margin-bottom: 20px; 
            flex-wrap: wrap; 
            background: rgba(255,255,255,0.7);
            padding: 10px 15px;
            border-radius: 60px;
        }
        .country-flag-large { width: 50px; height: 35px; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .country-name { 
            font-size: 1.8rem; 
            font-weight: 800; 
            letter-spacing: -0.02em; 
            color: #0b1f33;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .country-emoji { font-size: 1.8rem; }
        .country-stats { 
            margin-left: auto; 
            background: #eef2f6; 
            padding: 6px 16px; 
            border-radius: 40px; 
            font-size: 0.9rem; 
            font-weight: 600; 
            color: #1e3a6f; 
        }

        .toggle-btn {
            background: #2270b0;
            border: none;
            border-radius: 40px;
            padding: 8px 22px;
            font-weight: 700;
            font-size: 0.9rem;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(30,100,170,0.3);
            transition: 0.2s;
        }
        .toggle-btn:hover { background: #1b5d94; transform: scale(1.02); }

        /* Grille desktop : 4 colonnes */
        .program-list {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        .program-card {
            border-radius: 20px;
            padding: 16px;
            border: 1px solid;
            transition: 0.15s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .program-card:hover { transform: translateY(-4px); box-shadow: 0 12px 25px -8px rgba(0,55,120,0.2); }
        
        /* Couleurs par pays pour les cartes */
        .country-SUISSE .program-card { background: #fff5f5; border-color: #D52B1E; }
        .country-FRANCE .program-card { background: #f0f5ff; border-color: #002395; }
        .country-ALLEMAGNE .program-card { background: #f5f5f5; border-color: #000; }
        .country-BELGIQUE .program-card { background: #fffceb; border-color: #FDDA25; }
        .country-WALES .program-card { background: #f0fff0; border-color: #00A859; }
        .country-ANGLETERRE .program-card { background: #eef5ff; border-color: #012169; }
        .country-MADAGASCAR .program-card { background: #fff5f5; border-color: #FC3D32; }

        /* Dates agrandies et colorées par pays - avec sélecteurs renforcés */
        .country-block .program-card .program-date-badge { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            font-weight: 800; 
            color: #ffffff; 
            padding: 8px 14px; 
            border-radius: 40px; 
            width: fit-content; 
            font-size: 1rem; 
            border: 2px solid #ffd966;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        /* Couleurs par pays pour les badges de date - spécifiques et prioritaires */
        .country-block[data-pays="SUISSE"] .program-card .program-date-badge { background: #D52B1E !important; color: #ffffff !important; } /* Rouge suisse */
        .country-block[data-pays="FRANCE"] .program-card .program-date-badge { background: #002395 !important; color: #ffffff !important; } /* Bleu France */
        .country-block[data-pays="ALLEMAGNE"] .program-card .program-date-badge { background: #000000 !important; color: #ffffff !important; } /* Noir Allemagne */
        .country-block[data-pays="BELGIQUE"] .program-card .program-date-badge { background: #FDDA25 !important; color: #000000 !important; } /* Jaune Belgique, texte noir */
        .country-block[data-pays="WALES"] .program-card .program-date-badge { background: #00A859 !important; color: #ffffff !important; } /* Vert gallois */
        .country-block[data-pays="ANGLETERRE"] .program-card .program-date-badge { background: #012169 !important; color: #ffffff !important; } /* Bleu Angleterre */
        .country-block[data-pays="MADAGASCAR"] .program-card .program-date-badge { background: #FC3D32 !important; color: #ffffff !important; } /* Rouge Madagascar */
        
        /* Badge privé pour animations écoles - avec priorité */
        .program-card.private-event .program-date-badge {
            background: #6b7280 !important;
            border-color: #4b5563 !important;
            color: #ffffff !important;
        }

        .program-localite { font-weight: 700; font-size: 1.1rem; color: #122b44; }
        .program-lieu { 
            color: #f15a24; 
            font-weight: 600; 
            font-size: 0.9rem; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            background: rgba(255,255,255,0.8); 
            padding: 5px 10px; 
            border-radius: 40px; 
            width: fit-content; 
            border: 1px solid #fecaca;
        }
        .programme-text { 
            font-weight: 600; 
            color: #f97316; 
            font-size: 0.9rem; 
            background: rgba(255,255,255,0.8); 
            padding: 4px 12px; 
            border-radius: 30px; 
            display: inline-block; 
            border: 1px solid #fed7aa;
        }
        .program-card.private-event .programme-text {
            background: #9ca3af !important;
            color: #1e293b !important;
            border-color: #6b7280 !important;
        }

        footer { margin-top: 50px; text-align: center; color: #8094a8; font-size: 0.85rem; border-top: 1px solid #dce5ed; padding-top: 25px; }

        /* MODAL pour les détails d'une date (multi-programmes) */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; max-width: 600px; width: 90%; border-radius: 28px; padding: 24px; box-shadow: 0 30px 50px rgba(0,0,0,0.3); max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e7edf4; padding-bottom: 14px; margin-bottom: 20px; }
        .modal-header h3 { font-weight: 800; color: #1e293b; }
        .close-btn { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #7c8ba0; }
        .modal-program-card {
            background: #f9fbfe;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            border-left: 4px solid #f97316;
            cursor: pointer;
        }
        .modal-program-card:hover { background: #fff4e6; }
        
        /* Date dans la modal agrandie et colorée par pays */
        .modal-program-card .modal-date {
            font-weight: 800;
            font-size: 1.2rem;
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 40px;
            display: inline-block;
            margin-bottom: 10px;
            border: 2px solid #ffd966;
        }
        
        /* Couleurs par pays pour les dates dans les modales */
        .modal-program-card[data-pays="SUISSE"] .modal-date { background: #D52B1E; }
        .modal-program-card[data-pays="FRANCE"] .modal-date { background: #002395; }
        .modal-program-card[data-pays="ALLEMAGNE"] .modal-date { background: #000; }
        .modal-program-card[data-pays="BELGIQUE"] .modal-date { background: #FDDA25; color: #000; }
        .modal-program-card[data-pays="WALES"] .modal-date { background: #00A859; }
        .modal-program-card[data-pays="ANGLETERRE"] .modal-date { background: #012169; }
        .modal-program-card[data-pays="MADAGASCAR"] .modal-date { background: #FC3D32; }
        
        /* Lien sur une ligne avec options */
        .modal-loc {
            font-size: 0.85rem;
            color: #1e6f9f;
            margin-top: 6px;
            word-break: break-word;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }
        .modal-loc .link-container {
            display: flex;
            align-items: center;
            gap: 4px;
            max-width: 100%;
            overflow: hidden;
        }
        .modal-loc .link-container a {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
            color: #1e6f9f;
        }
        .modal-loc .action-icons {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .modal-loc .action-icons i {
            font-size: 0.9rem;
            color: #4a6f8e;
            cursor: pointer;
            transition: color 0.2s;
        }
        .modal-loc .action-icons i:hover {
            color: #f97316;
        }
        
        /* Badge privé dans la modal */
        .modal-program-card.private-event {
            border-left-color: #6b7280;
            opacity: 0.9;
        }
        .modal-program-card.private-event .modal-date {
            background: #6b7280 !important;
            border-color: #4b5563;
            color: #ffffff;
        }
        
        /* Mini drapeau dans les modales */
        .modal-flag {
            width: 24px;
            height: 16px;
            border-radius: 4px;
            display: inline-block;
            margin-right: 6px;
            vertical-align: middle;
        }
        .modal-country-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(0,0,0,0.05);
            padding: 4px 10px;
            border-radius: 30px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        /* ===== VERSION MOBILE OPTIMISÉE POUR 768px ===== */
        @media (max-width: 768px) {
            /* Calendrier - largeurs fixes pour éviter débordement */
            .calendrier-panel {
                width: 100%;
                overflow: hidden;
                padding: 12px;
            }
            .calendrier-grille { 
                gap: 2px;
                width: 100%;
                display: grid;
                grid-template-columns: repeat(7, minmax(0, 1fr));
            }
            .case-jour { 
                min-height: 70px; 
                padding: 4px 2px;
                font-size: 0.6rem;
                background: rgba(255,255,255,0.5);
                border-radius: 8px;
                width: 100%;
                max-width: 100%;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-start;
            }
            .jour-localite { 
                font-size: 0.6rem; 
                max-width: 100%;
                width: 100%;
                padding: 2px 2px;
                text-align: center;
                word-break: break-word;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
                line-height: 1.2;
                max-height: 2.4em;
                color: #166b8f;
                font-weight: 600;
            }
            .jour-programme { 
                display: none;
            }
            .mini-flag { 
                width: 16px; 
                height: 10px; 
                margin: 2px auto; 
                display: block;
            }
            .numero-jour { 
                font-size: 0.7rem;
                margin-bottom: 2px;
            }
            .jour-contenu {
                display: flex;
                flex-direction: column;
                align-items: center;
                width: 100%;
            }
            
            /* 3 prochains */
            .next-three-panel { padding: 12px; }
            .next-three-panel h2 { font-size: 1.1rem; }
            .next-card { padding: 10px; }
            .next-localite { font-size: 0.9rem; }
            .j-counter { font-size: 0.7rem; padding: 2px 8px; top: 6px; right: 8px; }
            
            /* Blocs pays */
            .country-header { gap: 8px; padding: 6px 10px; }
            .country-flag-large { width: 32px; height: 24px; }
            .country-name { font-size: 1.2rem; }
            .country-emoji { font-size: 1.2rem; }
            .country-stats { font-size: 0.7rem; padding: 3px 8px; }
            .toggle-btn { padding: 4px 12px; font-size: 0.7rem; }
            
            /* Grille programmes : 2 colonnes sans dépassement */
            .program-list { 
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 8px;
                width: 100%;
                max-width: 100%;
                overflow: hidden;
            }
            .program-card { 
                padding: 10px; 
                gap: 4px;
                width: 100%;
                max-width: 100%;
                min-width: 0;
                box-sizing: border-box;
            }
            .program-card * {
                max-width: 100%;
                overflow-wrap: break-word;
                word-wrap: break-word;
            }
            .program-date-badge { 
                font-size: 0.75rem; 
                padding: 4px 6px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 100%;
                width: auto;
            }
            .program-localite { 
                font-size: 0.8rem; 
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 100%;
            }
            .program-lieu { 
                font-size: 0.65rem; 
                padding: 3px 5px;
                max-width: 100%;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .programme-text { 
                font-size: 0.65rem; 
                padding: 3px 5px;
                max-width: 100%;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                display: block;
            }
            .program-card i {
                flex-shrink: 0;
            }
            .program-card div {
                max-width: 100%;
            }
            
            @media (max-width: 480px) {
                .program-date-badge { font-size: 0.7rem; padding: 3px 4px; }
                .program-localite { font-size: 0.75rem; }
                .program-lieu, .programme-text { font-size: 0.6rem; }
            }
        }

        img, svg, iframe, video, audio, embed, canvas, object {
            max-width: 100%;
        }
        .program-card .fas, .program-card .far, .program-card .fab {
            flex-shrink: 0;
        }
    </style>
</head>

            <div class="polaroid-caption">✨ Toutes nos source sont en TOI✨</div>

    <!-- RANGÉE HAUTE : CALENDRIER + 3 PROCHES -->

<!-- MODAL MULTI-PROGRAMMES POUR UNE DATE -->

        <div id="modalProgramsList"></div>
    </div>
</div>

<!-- MODAL DÉTAIL D'UN PROGRAMME (individuel) -->
<div id="programDetailModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="detailModalTitle">Détail du programme</h3>
            <button class="close-btn" onclick="closeDetailModal()"><i class="fas fa-times"></i></button>
        </div>
        <div id="detailModalBody"></div>
    </div>
</div>

<script>
(function() {
    // ----------------------------- CONFIG ---------------------------------
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSrF0hs00W-QvR3v5wxZA1ceGEx4xWR0dJv5kF3zgab6YVV00OehcwxYg-EJfOrMqj4IJnDl649SIkg/pub?gid=951917006&single=true&output=csv';
    const EXCLUDED_KEYWORDS = ['apéro','apero','repas','installation','visite','visites','repos','trajet','trajets','départ','retour','rest','relax','marche','shopping','marché','détente','voyage','transfert'];
    const PRIVATE_KEYWORDS = ['animation enfant','ecole','school','enfant','kids','child','élève','classe','scolaire','périscolaire','garderie'];
    const COUNTRY_FLAG_CLASS = { 'SUISSE':'flag-ch','FRANCE':'flag-fr','ALLEMAGNE':'flag-de','BELGIQUE':'flag-be','WALES':'flag-wales','ANGLETERRE':'flag-uk','MADAGASCAR':'flag-mada' };
    const COUNTRY_EMOJI = {
        'SUISSE': '🇨🇭', 'FRANCE': '🇫🇷', 'ALLEMAGNE': '🇩🇪', 'BELGIQUE': '🇧🇪',
        'WALES': '🏴󠁧󠁢󠁷󠁬󠁳󠁿', 'ANGLETERRE': '🏴󠁧󠁢󠁥󠁮󠁧󠁿', 'MADAGASCAR': '🇲🇬'
    };
    const COLUMNS = { DATE:0, LOCALITE:1, LIEU:2, HEURES:3, ADRESSE:4, HEBERGEMENT:5, PROGRAMME:6, LOCALISATION:7, SITE:8, PAYS:9, COORDS:10, TRAJETS:11 };

    let allData = [];
    let programsByCountry = {};
    let uniqueCountries = [];
    let flatPrograms = [];
    let countryByDate = new Map();

    let today = new Date(); 
    today.setHours(0,0,0,0);
    
    let currentCalMonth = new Date(today.getFullYear(), today.getMonth(), 1);
    const startDate = new Date(2026, 3, 1);
    if (currentCalMonth < startDate) {
        currentCalMonth = new Date(2026, 3, 1);
    }

    // ----------------------------- OUTILS ---------------------------------
    function parseCSV(text) {
        const lines = []; let cur=[], field='', inQuotes=false;
        for (let i=0; i<text.length; i++) {
            let c = text[i];
            if (c === '"' && !inQuotes) { inQuotes=true; continue; }
            if (c === '"' && inQuotes && text[i+1]==='"') { field+='"'; i++; continue; }
            if (c === '"' && inQuotes) { inQuotes=false; continue; }
            if (c === ',' && !inQuotes) { cur.push(field); field=''; continue; }
            if ((c === '\n' || c === '\r') && !inQuotes) {
                if (c === '\r' && text[i+1]==='\n') i++;
                if (field || cur.length) { cur.push(field); lines.push(cur); }
                cur = []; field = '';
                continue;
            }
            field += c;
        }
        if (field || cur.length) { cur.push(field); lines.push(cur); }
        return lines;
    }
    
    function parseDate(s) {
        if (!s) return null;
        let parts = s.split(/[/\-.]/);
        if (parts.length===3) {
            let d = parseInt(parts[0],10), m = parseInt(parts[1],10)-1, y = parseInt(parts[2],10);
            if (y<100) y+=2000;
            return new Date(y,m,d);
        }
        let d = new Date(s);
        return isNaN(d) ? null : d;
    }
    
    function formatDateFr(d) {
        if (!d) return '';
        let dd = d.getDate().toString().padStart(2,'0');
        let mm = (d.getMonth()+1).toString().padStart(2,'0');
        let yy = d.getFullYear().toString().slice(-2);
        return `${dd}/${mm}/${yy}`;
    }
    
    function getEmoji(p) {
        if (!p) return '📋';
        let low = p.toLowerCase();
        if (low.includes('concert')) return '🎤';
        if (low.includes('animation')||low.includes('jeux')) return '🎪';
        if (low.includes('culte')||low.includes('eglise')) return '⛪';
        if (low.includes('rencontre')) return '🤝';
        return '📋';
    }
    
    function isExcluded(prog, lieu) {
        let txt = (prog+' '+(lieu||'')).toLowerCase();
        return EXCLUDED_KEYWORDS.some(k => txt.includes(k));
    }
    
    function isPrivateEvent(prog, lieu) {
        let txt = (prog+' '+(lieu||'')).toLowerCase();
        return PRIVATE_KEYWORDS.some(k => txt.includes(k));
    }
    
    function getProgramDisplay(prog, loc, lieu) {
        if (prog && prog.trim()!=='' && !isExcluded(prog, lieu)) return prog.trim();
        if ((loc&&loc.trim()!=='') || (lieu&&lieu.trim()!=='')) return "Programme";
        return null;
    }
    
    function isPastProgram(prog) { return prog.date < today; }
    
    function daysUntil(date) {
        const diff = date - today;
        return Math.ceil(diff / (1000 * 60 * 60 * 24));
    }

    // Fonction pour créer un lien avec options de navigation
    function createLocationHTML(text, coords) {
        if (!text && !coords) return '';
        
        let url = '';
        let displayText = '';
        let googleMapsUrl = '';
        let wazeUrl = '';
        
        if (coords) {
            let m = coords.match(/([-+]?\d+\.\d+)[,\s]+([-+]?\d+\.\d+)/);
            if (m) {
                let lat = m[1];
                let lng = m[2];
                googleMapsUrl = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
                wazeUrl = `https://www.waze.com/ul?ll=${lat},${lng}&navigate=yes`;
                displayText = `${lat.substring(0,6)}…, ${lng.substring(0,6)}…`;
                url = googleMapsUrl;
            }
        } else if (text) {
            url = text.match(/^https?:\/\//) ? text : 'https://www.google.com/search?q='+encodeURIComponent(text);
            displayText = text.length > 30 ? text.substring(0, 27) + '…' : text;
            googleMapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(text)}`;
            wazeUrl = `https://www.waze.com/ul?q=${encodeURIComponent(text)}&navigate=yes`;
        }
        
        if (!url) return '';
        
        return `
            <div class="modal-loc">
                <i class="fas fa-map-marker-alt"></i>
                <div class="link-container">
                    <a href="${url}" target="_blank" rel="noopener">${displayText}</a>
                </div>
                <div class="action-icons">
                    <i class="fas fa-copy" onclick="copyText('${url}', event)" title="Copier le lien"></i>
                    <i class="fab fa-google" onclick="window.open('${googleMapsUrl || url}', '_blank')" title="Google Maps"></i>
                    <i class="fab fa-waze" onclick="window.open('${wazeUrl || url}', '_blank')" title="Waze"></i>
                </div>
            </div>
        `;
    }

    // ----------------------------- CHARGEMENT -----------------------------
    async function loadData() {
        const urls = [ SHEET_URL, 'https://api.allorigins.win/raw?url='+encodeURIComponent(SHEET_URL), 'https://corsproxy.io/?'+encodeURIComponent(SHEET_URL) ];
        let csvText = null;
        for (let url of urls) {
            try { let r = await fetch(url, {cache:'no-store'}); if (r.ok) { csvText = await r.text(); break; } } catch(e) {}
        }
        if (!csvText) throw new Error('Impossible de charger');
        let rows = parseCSV(csvText);
        if (rows.length<5) throw new Error('Format CSV invalide');
        allData = rows.slice(4).filter(r => r.length>=10 && r[COLUMNS.DATE] && r[COLUMNS.PAYS]);
        buildData();
        renderCalendrier(currentCalMonth);
        renderNextThree();
        renderCountries();
    }

    function buildData() {
        programsByCountry = {};
        flatPrograms = [];
        countryByDate.clear();

        allData.forEach(row => {
            let pays = (row[COLUMNS.PAYS]||'').trim().toUpperCase();
            if (!pays) return;
            let loc = row[COLUMNS.LOCALITE]||'';
            if (loc.toUpperCase().includes('RETOUR MADAGASCAR')) return;
            let progRaw = row[COLUMNS.PROGRAMME]||'';
            let lieu = row[COLUMNS.LIEU]||'';
            let progDisplay = getProgramDisplay(progRaw, loc, lieu);
            if (!progDisplay) return;
            if (isExcluded(progRaw, lieu)) return;
            let date = parseDate(row[COLUMNS.DATE]);
            if (!date) return;

            let dateKey = date.toISOString().split('T')[0];
            if (!countryByDate.has(dateKey)) {
                countryByDate.set(dateKey, pays);
            }

            let isPrivate = isPrivateEvent(progRaw, lieu);
            
            let item = {
                date, dateStr: formatDateFr(date),
                localite: loc, lieu, heures: row[COLUMNS.HEURES]||'',
                programme: progDisplay,
                adresse: row[COLUMNS.ADRESSE]||'',
                localisation: row[COLUMNS.LOCALISATION]||'',
                site: row[COLUMNS.SITE]||'',
                coords: row[COLUMNS.COORDS]||'',
                pays,
                isPrivate,
                flagClass: COUNTRY_FLAG_CLASS[pays] || 'flag-fr',
                countryEmoji: COUNTRY_EMOJI[pays] || '🇪🇺'
            };
            if (!programsByCountry[pays]) programsByCountry[pays] = [];
            programsByCountry[pays].push(item);
            flatPrograms.push(item);
        });

        for (let p in programsByCountry) {
            programsByCountry[p].sort((a,b)=>a.date-b.date);
        }
        flatPrograms.sort((a,b)=>a.date-b.date);
        const order = ['SUISSE','FRANCE','ALLEMAGNE','BELGIQUE','WALES','ANGLETERRE','MADAGASCAR'];
        uniqueCountries = order.filter(c => programsByCountry[c] && programsByCountry[c].length>0);
    }

    // ----------------------------- CALENDRIER -----------------------------
    function renderCalendrier(date) {
        let mois = date.getMonth(), an = date.getFullYear();
        document.getElementById('moisAnnee').innerText = date.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
        let premier = new Date(an, mois, 1);
        let dernier = new Date(an, mois+1, 0);
        let debutSem = premier.getDay();
        if (debutSem===0) debutSem=7;
        let joursPrev = debutSem-1;

        let html = '<div class="jour-nom">L</div><div class="jour-nom">M</div><div class="jour-nom">M</div><div class="jour-nom">J</div><div class="jour-nom">V</div><div class="jour-nom">S</div><div class="jour-nom">D</div>';

        let prevMonth = new Date(an, mois, 0);
        let prevDays = prevMonth.getDate();
        for (let i=0; i<joursPrev; i++) {
            let jour = prevDays - joursPrev + i + 1;
            html += `<div class="case-jour autre-mois"><span class="numero-jour">${jour}</span></div>`;
        }

        for (let d=1; d<=dernier.getDate(); d++) {
            let curDate = new Date(an, mois, d);
            let dateKey = curDate.toISOString().split('T')[0];
            let programmesDuJour = flatPrograms.filter(p => p.date.toDateString() === curDate.toDateString() && !isPastProgram(p));
            let paysDuJour = null;
            if (programmesDuJour.length>0) {
                paysDuJour = programmesDuJour[0].pays;
            } else if (countryByDate.has(dateKey)) {
                paysDuJour = countryByDate.get(dateKey);
            }
            let flagHtml = paysDuJour ? `<div class="mini-flag ${COUNTRY_FLAG_CLASS[paysDuJour]||'flag-fr'}"></div>` : '';

            let localite = programmesDuJour.length>0 ? programmesDuJour[0].localite : '';

            html += `<div class="case-jour" onclick="showProgramsForDate('${curDate}')">`;
            html += `<span class="numero-jour">${d}</span>`;
            if (paysDuJour) {
                html += `<div class="jour-contenu">`;
                html += flagHtml;
                if (localite) html += `<div class="jour-localite">${localite}</div>`;
                html += `</div>`;
            }
            html += `</div>`;
        }

        let totalCases = joursPrev + dernier.getDate();
        let reste = 42 - totalCases;
        for (let i=1; i<=reste; i++) {
            html += `<div class="case-jour autre-mois"><span class="numero-jour">${i}</span></div>`;
        }
        document.getElementById('calendrierGrille').innerHTML = html;
    }

    window.showProgramsForDate = function(dateStr) {
        try {
            let d = new Date(dateStr);
            let programmes = flatPrograms.filter(p => p.date && p.date.toDateString() === d.toDateString() && !isPastProgram(p));
            let modal = document.getElementById('dateProgramsModal');
            let daySpan = document.getElementById('modalDateDay');
            daySpan.innerText = d.toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'});

            let listDiv = document.getElementById('modalProgramsList');
            listDiv.innerHTML = '';

            if (programmes.length===0) {
                let dateKey = d.toISOString().split('T')[0];
                if (countryByDate.has(dateKey)) {
                    listDiv.innerHTML = `<div style="padding:20px; text-align:center;">Aucun programme public, mais le groupe est en ${countryByDate.get(dateKey)}</div>`;
                } else {
                    listDiv.innerHTML = '<div style="padding:20px; text-align:center;">Aucun programme public ce jour</div>';
                }
            } else {
                programmes.forEach(p => {
                    if (!p) return;
                    let card = document.createElement('div');
                    card.className = 'modal-program-card' + (p.isPrivate ? ' private-event' : '');
                    card.setAttribute('data-pays', p.pays);
                    
                    // Utiliser une fonction pour capturer correctement p
                    card.addEventListener('click', function() {
                        closeDateModal();
                        openDetailModal(p);
                    });

                    let locHTML = p.localisation || p.coords ? createLocationHTML(p.localisation, p.coords) : '';
                    let siteHTML = p.site ? createLocationHTML(p.site, null) : '';

                    card.innerHTML = `
                        <div class="modal-country-badge">
                            <div class="mini-flag ${p.flagClass}" style="width:20px; height:14px; margin-right:6px;"></div>
                            ${p.countryEmoji} ${p.pays}
                        </div>
                        <div class="modal-date">📅 ${p.dateStr} ${p.heures ? '· ' + p.heures : ''}</div>
                        <div style="font-weight:600;">📍 ${p.localite || 'Lieu non précisé'}</div>
                        ${locHTML}
                        ${siteHTML}
                        <div style="margin-top:8px;"><span class="programme-text">${getEmoji(p.programme)} ${p.programme || 'Programme'}</span></div>
                        ${p.isPrivate ? '<div style="margin-top:6px; font-size:0.75rem; color:#6b7280;"><i class="fas fa-lock"></i> Événement privé (école/enfants)</div>' : ''}
                    `;
                    listDiv.appendChild(card);
                });
            }
            modal.style.display = 'flex';
        } catch (e) {
            console.error('Erreur dans showProgramsForDate:', e);
        }
    };

    window.closeDateModal = function() {
        document.getElementById('dateProgramsModal').style.display = 'none';
    };

    window.openDetailModal = function(p) {
        try {
            if (!p) return;
            let modal = document.getElementById('programDetailModal');
            let title = document.getElementById('detailModalTitle');
            title.innerText = (p.localite || 'Lieu') + ' · ' + (p.pays || 'Pays') + (p.isPrivate ? ' (Privé)' : '');
            let body = document.getElementById('detailModalBody');

            let locHTML = p.localisation || p.coords ? createLocationHTML(p.localisation, p.coords) : '';
            let siteHTML = p.site ? createLocationHTML(p.site, null) : '';

            body.innerHTML = `
                <div style="display:flex; align-items:center; gap:10px; margin-bottom:15px;">
                    <div class="mini-flag ${p.flagClass}" style="width:30px; height:20px;"></div>
                    <span style="font-weight:700; font-size:1.2rem;">${p.countryEmoji || '🇪🇺'} ${p.pays || ''}</span>
                </div>
                <div class="modal-detail-row"><span class="modal-icon">📅</span><span class="modal-info"><strong>${p.dateStr || ''} ${p.heures ? '· ' + p.heures : ''}</strong></span></div>
                <div class="modal-detail-row"><span class="modal-icon">🏷️</span><span class="modal-info"><strong>${p.programme || 'Programme'}</strong></span></div>
                <div class="modal-detail-row"><span class="modal-icon">📍</span><span class="modal-info"><strong>${p.lieu || 'Lieu non précisé'}</strong>${p.adresse ? '<br>'+p.adresse : ''}</span></div>
                ${locHTML}
                ${siteHTML}
                <hr>
                <div class="modal-detail-row"><span class="modal-icon">ℹ️</span><span class="modal-info">${p.isPrivate ? 'Événement privé (école/enfants)' : 'Événement public'}</span></div>
            `;
            modal.style.display = 'flex';
        } catch (e) {
            console.error('Erreur dans openDetailModal:', e);
        }
    };

    window.closeDetailModal = function() {
        document.getElementById('programDetailModal').style.display = 'none';
    };

    document.getElementById('prevMonthBtn').addEventListener('click', ()=>{
        currentCalMonth.setMonth(currentCalMonth.getMonth()-1);
        renderCalendrier(currentCalMonth);
    });
    document.getElementById('nextMonthBtn').addEventListener('click', ()=>{
        currentCalMonth.setMonth(currentCalMonth.getMonth()+1);
        renderCalendrier(currentCalMonth);
    });

    function renderNextThree() {
        try {
            let upcoming = flatPrograms.filter(p => !isPastProgram(p)).slice(0,3);
            let container = document.getElementById('nextCardsContainer');
            let panel = document.getElementById('nextThreePanel');
            if (upcoming.length===0) { panel.style.display='none'; return; }
            panel.style.display='block';
            container.innerHTML = '';
            upcoming.forEach(p => {
                if (!p) return;
                let card = document.createElement('div');
                card.className = 'next-card';
                
                // Utiliser addEventListener pour capturer correctement p
                card.addEventListener('click', function() {
                    openDetailModal(p);
                });
                
                let jours = daysUntil(p.date);
                let jourText = jours === 0 ? "Aujourd'hui" : jours === 1 ? "Demain" : `J-${jours}`;
                
                let locDisplay = p.lieu || 'Lieu à préciser';
                
                card.innerHTML = `
                    <div class="j-counter">${jourText}</div>
                    <div class="next-date">📅 ${p.dateStr} ${p.heures ? '· ' + p.heures : ''}</div>
                    <div class="next-localite">
                        <div class="next-flag ${p.flagClass}"></div>
                        📍 ${p.localite || '?'}
                    </div>
                    <div class="next-lieu" style="font-size:0.8rem;">${locDisplay}</div>
                    <div style="margin-top:8px;"><span class="programme-text">${getEmoji(p.programme)} ${p.programme || 'Programme'}</span></div>
                    ${p.isPrivate ? '<div style="margin-top:4px; font-size:0.7rem; color:#6b7280;"><i class="fas fa-lock"></i> Privé</div>' : ''}
                `;
                container.appendChild(card);
            });
        } catch (e) {
            console.error('Erreur dans renderNextThree:', e);
        }
    }

    function renderCountries() {
        try {
            let container = document.getElementById('programmesPublic');
            if (!container) return;
            if (uniqueCountries.length===0) { container.innerHTML = '<div style="padding:40px; text-align:center;">Aucun programme à venir.</div>'; return; }

            let html = '';
            uniqueCountries.forEach(pays => {
                let programmes = programsByCountry[pays] ? programsByCountry[pays].filter(p => !isPastProgram(p)) : [];
                if (programmes.length===0) return;
                let flagClass = COUNTRY_FLAG_CLASS[pays]||'flag-fr';
                let paysDisplay = pays.charAt(0)+pays.slice(1).toLowerCase();
                let emoji = COUNTRY_EMOJI[pays] || '🇪🇺';

                html += `<div class="country-block" data-pays="${pays}" id="block-${pays}">`;
                html += `<div class="country-header">`;
                html += `<div class="country-flag-large ${flagClass}"></div>`;
                html += `<span class="country-name"><span class="country-emoji">${emoji}</span> ${paysDisplay}</span>`;
                html += `<span class="country-stats"><i class="far fa-calendar-alt"></i> ${programmes.length} programme${programmes.length>1?'s':''}</span>`;
                html += `<button class="toggle-btn" onclick="toggleCountry('${pays}')" id="toggle-${pays}"><i class="fas fa-eye"></i> Afficher</button>`;
                html += `</div>`;
                html += `<div class="program-list" id="list-${pays}" style="display: none;">`;
                programmes.forEach(p => {
                    if (!p) return;
                    let emojiProg = getEmoji(p.programme);
                    let lieuAffiche = p.lieu || 'Lieu à préciser';
                    if (lieuAffiche.length>30) lieuAffiche = lieuAffiche.slice(0,27)+'…';
                    
                    let cardClass = 'program-card' + (p.isPrivate ? ' private-event' : '');
                    
                    // Créer un ID unique pour chaque carte
                    let cardId = 'card-' + pays + '-' + p.dateStr.replace(/\//g, '-') + '-' + Math.random().toString(36).substr(2, 9);
                    
                    html += `<div class="${cardClass}" id="${cardId}" data-pays="${pays}" data-program='${JSON.stringify(p).replace(/'/g, "&#39;").replace(/"/g, "&quot;")}'>`;
                    html += `<div class="program-date-badge"><i class="far fa-calendar"></i> ${p.dateStr} ${p.heures ? '· '+p.heures : ''}</div>`;
                    html += `<div class="program-localite"><i class="fas fa-map-pin"></i> ${p.localite||'?'}</div>`;
                    if (p.lieu) html += `<div class="program-lieu"><i class="fas fa-location-dot"></i> ${lieuAffiche}</div>`;
                    html += `<div class="program-type-emojis"><span class="programme-text">${emojiProg} ${p.programme || 'Programme'}</span></div>`;
                    if (p.isPrivate) html += `<div style="margin-top:4px; font-size:0.7rem; color:#6b7280;"><i class="fas fa-lock"></i> Privé</div>`;
                    html += `</div>`;
                });
                html += `</div></div>`;
            });
            container.innerHTML = html;
            
            // Ajouter les écouteurs d'événements après avoir inséré le HTML
            setTimeout(() => {
                document.querySelectorAll('.program-card').forEach(card => {
                    if (!card.hasAttribute('data-listener')) {
                        card.setAttribute('data-listener', 'true');
                        card.addEventListener('click', function(e) {
                            e.stopPropagation();
                            try {
                                // Récupérer les données depuis l'attribut data-program
                                let programData = this.getAttribute('data-program');
                                if (programData) {
                                    let p = JSON.parse(programData);
                                    openDetailModal(p);
                                }
                            } catch (err) {
                                console.error('Erreur lors du clic sur la carte:', err);
                            }
                        });
                    }
                });
            }, 100);
            
        } catch (e) {
            console.error('Erreur dans renderCountries:', e);
        }
    }

    window.toggleCountry = function(pays) {
        let list = document.getElementById('list-'+pays);
        let btn = document.getElementById('toggle-'+pays);
        if (!list || !btn) return;
        if (list.style.display === 'none' || list.style.display === '') {
            list.style.display = 'grid';
            btn.innerHTML = '<i class="fas fa-eye-slash"></i> Masquer';
        } else {
            list.style.display = 'none';
            btn.innerHTML = '<i class="fas fa-eye"></i> Afficher';
        }
    };

    window.copyText = function(text, ev) { 
        ev.stopPropagation(); 
        navigator.clipboard.writeText(text).then(()=>alert('📋 Copié!')); 
    };

    window.onclick = function(e) {
        if (e.target.classList.contains('modal')) e.target.style.display = 'none';
    };

    loadData().catch(e => console.error('Erreur chargement données:', e));
})();
</script>
</body>
</html>
