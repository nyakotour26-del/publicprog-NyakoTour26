<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>Tournée Europe 2026-NY AKO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f4f7fb; color: #1e293b; padding: 16px; min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 24px; }
        h1 { font-size: 2.2rem; font-weight: 800; background: linear-gradient(145deg, #0f2b4b, #1e3a6f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.02em; }
        .subhead { font-size: 1rem; color: #5b6e8c; margin-top: 6px; }

        .flags-strip { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 20px 0 10px; }
        .flag-mini { width: 36px; height: 24px; border-radius: 4px; box-shadow: 0 3px 8px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .flag-mini:hover { transform: scale(1.1); }
        .flag-fr { background: linear-gradient(to right, #002395 33.3%, #fff 33.3%, #fff 66.6%, #ED2939 66.6%); }
        .flag-de { background: linear-gradient(to bottom, #000 33.3%, #DD0000 33.3%, #DD0000 66.6%, #FFCE00 66.6%); }
        .flag-be { background: linear-gradient(to right, #000 33.3%, #FAE042 33.3%, #FAE042 66.6%, #ED2939 66.6%); }
        .flag-ch { background: #D52B1E; position: relative; }
        .flag-ch::before, .flag-ch::after { content:''; position:absolute; background:#fff; }
        .flag-ch::before { width: 20px; height: 5px; top:9px; left:8px; }
        .flag-ch::after { width: 5px; height: 20px; top:2px; left:15px; }
        .flag-uk { background: #012169; position:relative; }
        .flag-uk::before, .flag-uk::after { content:''; position:absolute; background:#fff; }
        .flag-uk::before { width:36px; height:4px; top:10px; left:0; }
        .flag-uk::after { width:4px; height:24px; top:0; left:16px; }
        .flag-wales { background: #fff; position:relative; overflow:hidden; }
        .flag-wales::before { content:''; position:absolute; inset:0; background: linear-gradient(135deg, #fff 50%, #D21034 50%); }
        .flag-mada { background: #fff; position:relative; }
        .flag-mada::before { content:''; position:absolute; left:0; top:0; width:33%; height:100%; background:#FC3D32; }
        .flag-mada::after { content:''; position:absolute; left:0; bottom:0; width:33%; height:50%; background:#007E3A; }

        /* ----- DISPOSITION RESPONSIVE : côte à côte seulement à partir de 900px ----- */
        .top-row {
            display: flex;
            flex-direction: column;  /* par défaut empilé (mobile) */
            gap: 24px;
            margin-bottom: 30px;
        }

        @media (min-width: 900px) {
            .top-row {
                flex-direction: row;
            }
            .calendrier-panel {
                flex: 1 1 50%;
            }
            .next-three-panel {
                flex: 1 1 40%;
            }
        }

        .calendrier-panel {
            background: white;
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 15px 30px -10px rgba(0,50,80,0.15);
            border: 1px solid rgba(0,80,150,0.1);
            min-width: 280px;
        }
        .next-three-panel {
            background: linear-gradient(145deg, #ffffff, #f2f6fd);
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 15px 30px -10px rgba(0,55,100,0.15);
            border: 1px solid rgba(0,90,150,0.1);
            min-width: 280px;
        }
        .next-three-panel h2 {
            font-size: 1.4rem;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #163a5f;
        }

        .calendrier-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .mois-annee {
            font-weight: 800;
            font-size: 1.3rem;
            color: #1e3f64;
        }
        .btn-nav {
            background: #e7effa;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            color: #255f91;
            transition: 0.2s;
        }
        .btn-nav:hover { background: #d0e2f5; }
        .calendrier-grille {
            display: grid;
            grid-template-columns: repeat(7,1fr);
            gap: 6px;
        }
        .jour-nom {
            text-align: center;
            font-weight: 700;
            color: #6b7c93;
            font-size: 0.8rem;
            padding: 6px 0;
        }
        .case-jour {
            background: #f8fbfe;
            border-radius: 16px;
            padding: 8px 4px;
            min-height: 80px;
            border: 1px solid #dee9f2;
            transition: 0.1s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.7rem;
            position: relative;
        }
        .case-jour:hover { background: #e3effa; border-color: #a1c4e5; }
        .case-jour.autre-mois { opacity: 0.4; }
        .numero-jour { font-weight: 700; font-size: 0.85rem; margin-bottom: 2px; }

        .jour-localite {
            font-weight: 600;
            color: #166b8f;
            font-size: 0.65rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80px;
            margin-top: 2px;
        }
        .jour-programme {
            color: #f97316;
            font-weight: 500;
            font-size: 0.6rem;
            background: #fff0e5;
            border-radius: 10px;
            padding: 2px 6px;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80px;
        }
        .mini-flag { width: 18px; height: 12px; border-radius: 2px; display: inline-block; margin: 2px auto; }

        /* 3 prochains cards (vertical) */
        .next-cards-vertical {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .next-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 5px 12px rgba(0,0,0,0.03);
            border: 1px solid #d9e5f0;
            transition: 0.15s;
            cursor: pointer;
        }
        .next-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,90,150,0.1); background: #fafdff; }
        .next-date { font-weight: 700; color: #1e5b9c; background: #e2ecfb; padding: 4px 10px; border-radius: 30px; display: inline-block; margin-bottom: 8px; font-size:0.85rem;}
        .next-localite { font-weight: 800; font-size: 1.1rem; color: #0b2b4a; }
        .next-lieu { color: #f15a24; font-weight: 600; font-size: 0.85rem; }

        /* pays blocks */
        .programs-grid { display: flex; flex-direction: column; gap: 24px; margin: 30px 0; }
        .country-block { background: white; border-radius: 24px; padding: 20px 18px; box-shadow: 0 12px 30px -8px rgba(0,20,40,0.15); border-left: 6px solid; }
        .country-block[data-pays="SUISSE"] { border-left-color: #D52B1E; }
        .country-block[data-pays="FRANCE"] { border-left-color: #002395; }
        .country-block[data-pays="ALLEMAGNE"] { border-left-color: #000; }
        .country-block[data-pays="BELGIQUE"] { border-left-color: #FDDA25; }
        .country-block[data-pays="WALES"] { border-left-color: #D21034; }
        .country-block[data-pays="ANGLETERRE"] { border-left-color: #012169; }
        .country-block[data-pays="MADAGASCAR"] { border-left-color: #FC3D32; }

        .country-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
        .country-flag-large { width: 50px; height: 35px; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .country-name { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.02em; color: #0b1f33; }
        .country-stats { margin-left: auto; background: #eef2f6; padding: 6px 16px; border-radius: 40px; font-size: 0.9rem; font-weight: 600; color: #1e3a6f; }

        .toggle-btn {
            background: #2270b0;
            border: none;
            border-radius: 40px;
            padding: 8px 22px;
            font-weight: 700;
            font-size: 0.9rem;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(30,100,170,0.3);
            transition: 0.2s;
        }
        .toggle-btn:hover { background: #1b5d94; transform: scale(1.02); }

        .program-list {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4 par ligne desktop */
            gap: 14px;
        }
        .program-card {
            background: #f9fbfe;
            border-radius: 20px;
            padding: 16px;
            border: 1px solid #e3eaf2;
            transition: 0.15s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .program-card:hover { transform: translateY(-4px); box-shadow: 0 12px 25px -8px rgba(0,55,120,0.2); background: #ffffff; border-color: #bdd3eb; }
        .program-date-badge { display: flex; align-items: center; gap: 6px; font-weight: 700; color: #0a4b7a; background: #e2ecf9; padding: 5px 12px; border-radius: 30px; width: fit-content; font-size: 0.8rem; }
        .program-localite { font-weight: 700; font-size: 1.1rem; color: #122b44; }
        .program-lieu { color: #f15a24; font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; background: #fff1e6; padding: 5px 10px; border-radius: 40px; width: fit-content; }
        .programme-text { font-weight: 600; color: #f97316; font-size: 0.9rem; background: #fff4e6; padding: 4px 12px; border-radius: 30px; display: inline-block; }
        .localisation-link { color: #1e6f9f; font-size: 0.8rem; text-decoration: underline dotted; cursor: pointer; word-break: break-all; }
        .copy-icon { margin-left: 6px; color: #7e93a8; font-size: 0.7rem; cursor: pointer; }
        .copy-icon:hover { color: #2b6f9e; }

        footer { margin-top: 50px; text-align: center; color: #8094a8; font-size: 0.85rem; border-top: 1px solid #dce5ed; padding-top: 25px; }

        /* MODAL pour les détails d'une date (multi-programmes) */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; max-width: 600px; width: 90%; border-radius: 28px; padding: 24px; box-shadow: 0 30px 50px rgba(0,0,0,0.3); max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e7edf4; padding-bottom: 14px; margin-bottom: 20px; }
        .modal-header h3 { font-weight: 800; color: #1e293b; }
        .close-btn { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #7c8ba0; }
        .modal-program-card {
            background: #f9fbfe;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 12px;
            border-left: 4px solid #f97316;
            cursor: pointer;
        }
        .modal-program-card:hover { background: #fff4e6; }

        /* Ajustements responsive pour la grille de programmes */
        @media (max-width: 1000px) {
            .program-list { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 700px) {
            .program-list { grid-template-columns: repeat(2, 1fr); }
            .country-name { font-size: 1.5rem; }
        }
        @media (max-width: 480px) {
            .program-list { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>🇪🇺 TOURNÉE EUROPE 2026 · NY AKO</h1>
        <div class="subhead">Tous les programmes ouverts • mise à jour automatique</div>
        <div class="flags-strip">
            <div class="flag-mini flag-ch" title="Suisse"></div>
            <div class="flag-mini flag-fr" title="France"></div>
            <div class="flag-mini flag-de" title="Allemagne"></div>
            <div class="flag-mini flag-be" title="Belgique"></div>
            <div class="flag-mini flag-uk" title="Angleterre"></div>
            <div class="flag-mini flag-wales" title="Wales"></div>
            <div class="flag-mini flag-mada" title="Madagascar"></div>
        </div>
    </header>

    <!-- RANGÉE HAUTE : CALENDRIER + 3 PROCHAINS (côte à côte sur desktop) -->
    <div class="top-row">
        <!-- CALENDRIER -->
        <div class="calendrier-panel">
            <div class="calendrier-header">
                <button class="btn-nav" id="prevMonthBtn"><i class="fas fa-chevron-left"></i></button>
                <span class="mois-annee" id="moisAnnee">Avril 2026</span>
                <button class="btn-nav" id="nextMonthBtn"><i class="fas fa-chevron-right"></i></button>
            </div>
            <div class="calendrier-grille" id="calendrierGrille"></div>
        </div>

        <!-- 3 PROCHAINS PROGRAMMES (version verticale) -->
        <div class="next-three-panel" id="nextThreePanel">
            <h2><i class="fas fa-hourglass-half"></i> 3 prochains</h2>
            <div id="nextCardsContainer" class="next-cards-vertical"></div>
        </div>
    </div>

    <!-- LISTE PAYS -->
    <div id="programmesPublic" class="programs-grid"></div>

    <footer><i class="fas fa-music"></i> Données extraites automatiquement · version grand public</footer>
</div>

<!-- MODAL MULTI-PROGRAMMES POUR UNE DATE -->
<div id="dateProgramsModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalDateTitle">Programmes du <span id="modalDateDay"></span></h3>
            <button class="close-btn" onclick="closeDateModal()"><i class="fas fa-times"></i></button>
        </div>
        <div id="modalProgramsList"></div>
    </div>
</div>

<!-- MODAL DÉTAIL D'UN PROGRAMME (individuel) -->
<div id="programDetailModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="detailModalTitle">Détail du programme</h3>
            <button class="close-btn" onclick="closeDetailModal()"><i class="fas fa-times"></i></button>
        </div>
        <div id="detailModalBody"></div>
    </div>
</div>

<script>
(function() {
    // ----------------------------- CONFIG ---------------------------------
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSrF0hs00W-QvR3v5wxZA1ceGEx4xWR0dJv5kF3zgab6YVV00OehcwxYg-EJfOrMqj4IJnDl649SIkg/pub?gid=951917006&single=true&output=csv';
    const EXCLUDED_KEYWORDS = ['apéro','apero','repas','installation','visite','visites','repos','trajet','trajets','départ','retour','rest','relax','marche','shopping','marché','détente','voyage','transfert'];
    const COUNTRY_FLAG_CLASS = { 'SUISSE':'flag-ch','FRANCE':'flag-fr','ALLEMAGNE':'flag-de','BELGIQUE':'flag-be','WALES':'flag-wales','ANGLETERRE':'flag-uk','MADAGASCAR':'flag-mada' };
    const COLUMNS = { DATE:0, LOCALITE:1, LIEU:2, HEURES:3, ADRESSE:4, HEBERGEMENT:5, PROGRAMME:6, LOCALISATION:7, SITE:8, PAYS:9, COORDS:10, TRAJETS:11 };

    let allData = [];
    let programsByCountry = {};
    let uniqueCountries = [];
    let flatPrograms = [];        // tous les programmes (filtrés, sans exclus)
    let countryByDate = new Map(); // date string -> pays (pour le drapeau)

    let today = new Date(); today.setHours(0,0,0,0);

    // ----------------------------- OUTILS ---------------------------------
    function parseCSV(text) {
        const lines = []; let cur=[], field='', inQuotes=false;
        for (let i=0; i<text.length; i++) {
            let c = text[i];
            if (c === '"' && !inQuotes) { inQuotes=true; continue; }
            if (c === '"' && inQuotes && text[i+1]==='"') { field+='"'; i++; continue; }
            if (c === '"' && inQuotes) { inQuotes=false; continue; }
            if (c === ',' && !inQuotes) { cur.push(field); field=''; continue; }
            if ((c === '\n' || c === '\r') && !inQuotes) {
                if (c === '\r' && text[i+1]==='\n') i++;
                if (field || cur.length) { cur.push(field); lines.push(cur); }
                cur = []; field = '';
                continue;
            }
            field += c;
        }
        if (field || cur.length) { cur.push(field); lines.push(cur); }
        return lines;
    }
    function parseDate(s) {
        if (!s) return null;
        let parts = s.split(/[/\-.]/);
        if (parts.length===3) {
            let d = parseInt(parts[0],10), m = parseInt(parts[1],10)-1, y = parseInt(parts[2],10);
            if (y<100) y+=2000;
            return new Date(y,m,d);
        }
        let d = new Date(s);
        return isNaN(d) ? null : d;
    }
    function formatDateFr(d) {
        if (!d) return '';
        let dd = d.getDate().toString().padStart(2,'0');
        let mm = (d.getMonth()+1).toString().padStart(2,'0');
        let yy = d.getFullYear().toString().slice(-2);
        return `${dd}/${mm}/${yy}`;
    }
    function getEmoji(p) {
        if (!p) return '📋';
        let low = p.toLowerCase();
        if (low.includes('concert')) return '🎤';
        if (low.includes('animation')||low.includes('jeux')) return '🎪';
        if (low.includes('culte')||low.includes('eglise')) return '⛪';
        if (low.includes('rencontre')) return '🤝';
        return '📋';
    }
    function isExcluded(prog, lieu) {
        let txt = (prog+' '+(lieu||'')).toLowerCase();
        return EXCLUDED_KEYWORDS.some(k => txt.includes(k));
    }
    function getProgramDisplay(prog, loc, lieu) {
        if (prog && prog.trim()!=='' && !isExcluded(prog, lieu)) return prog.trim();
        if ((loc&&loc.trim()!=='') || (lieu&&lieu.trim()!=='')) return "Programme";
        return null;
    }
    function isPastProgram(prog) { return prog.date < today; }

    // ----------------------------- CHARGEMENT -----------------------------
    async function loadData() {
        const urls = [ SHEET_URL, 'https://api.allorigins.win/raw?url='+encodeURIComponent(SHEET_URL), 'https://corsproxy.io/?'+encodeURIComponent(SHEET_URL) ];
        let csvText = null;
        for (let url of urls) {
            try { let r = await fetch(url, {cache:'no-store'}); if (r.ok) { csvText = await r.text(); break; } } catch(e) {}
        }
        if (!csvText) throw new Error('Impossible de charger');
        let rows = parseCSV(csvText);
        if (rows.length<5) throw new Error('Format CSV invalide');
        allData = rows.slice(4).filter(r => r.length>=10 && r[COLUMNS.DATE] && r[COLUMNS.PAYS]);
        buildData();
        renderCalendrier(currentCalMonth);
        renderNextThree();
        renderCountries();
    }

    function buildData() {
        programsByCountry = {};
        flatPrograms = [];
        countryByDate.clear();

        allData.forEach(row => {
            let pays = (row[COLUMNS.PAYS]||'').trim().toUpperCase();
            if (!pays) return;
            let loc = row[COLUMNS.LOCALITE]||'';
            if (loc.toUpperCase().includes('RETOUR MADAGASCAR')) return;
            let progRaw = row[COLUMNS.PROGRAMME]||'';
            let lieu = row[COLUMNS.LIEU]||'';
            let progDisplay = getProgramDisplay(progRaw, loc, lieu);
            if (!progDisplay) return;
            if (isExcluded(progRaw, lieu)) return;
            let date = parseDate(row[COLUMNS.DATE]);
            if (!date) return;

            let dateKey = date.toISOString().split('T')[0];
            if (!countryByDate.has(dateKey)) {
                countryByDate.set(dateKey, pays);
            }

            let item = {
                date, dateStr: formatDateFr(date),
                localite: loc, lieu, heures: row[COLUMNS.HEURES]||'',
                programme: progDisplay,
                adresse: row[COLUMNS.ADRESSE]||'',
                localisation: row[COLUMNS.LOCALISATION]||'',
                site: row[COLUMNS.SITE]||'',
                coords: row[COLUMNS.COORDS]||'',
                pays
            };
            if (!programsByCountry[pays]) programsByCountry[pays] = [];
            programsByCountry[pays].push(item);
            flatPrograms.push(item);
        });

        for (let p in programsByCountry) {
            programsByCountry[p].sort((a,b)=>a.date-b.date);
        }
        flatPrograms.sort((a,b)=>a.date-b.date);
        const order = ['SUISSE','FRANCE','ALLEMAGNE','BELGIQUE','WALES','ANGLETERRE','MADAGASCAR'];
        uniqueCountries = order.filter(c => programsByCountry[c] && programsByCountry[c].length>0);
    }

    // ----------------------------- CALENDRIER -----------------------------
    let currentCalMonth = new Date(2026, 3, 1); // avril

    function renderCalendrier(date) {
        let mois = date.getMonth(), an = date.getFullYear();
        document.getElementById('moisAnnee').innerText = date.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
        let premier = new Date(an, mois, 1);
        let dernier = new Date(an, mois+1, 0);
        let debutSem = premier.getDay(); // 0=dimanche
        if (debutSem===0) debutSem=7; // lundi=1
        let joursPrev = debutSem-1;

        let html = '<div class="jour-nom">L</div><div class="jour-nom">M</div><div class="jour-nom">M</div><div class="jour-nom">J</div><div class="jour-nom">V</div><div class="jour-nom">S</div><div class="jour-nom">D</div>';

        let prevMonth = new Date(an, mois, 0);
        let prevDays = prevMonth.getDate();
        for (let i=0; i<joursPrev; i++) {
            let jour = prevDays - joursPrev + i + 1;
            html += `<div class="case-jour autre-mois"><span class="numero-jour">${jour}</span></div>`;
        }

        for (let d=1; d<=dernier.getDate(); d++) {
            let curDate = new Date(an, mois, d);
            let dateKey = curDate.toISOString().split('T')[0];
            let programmesDuJour = flatPrograms.filter(p => p.date.toDateString() === curDate.toDateString() && !isPastProgram(p));
            let paysDuJour = null;
            if (programmesDuJour.length>0) {
                paysDuJour = programmesDuJour[0].pays;
            } else if (countryByDate.has(dateKey)) {
                paysDuJour = countryByDate.get(dateKey);
            }
            let flagHtml = paysDuJour ? `<div class="mini-flag ${COUNTRY_FLAG_CLASS[paysDuJour]||'flag-fr'}"></div>` : '';

            let localite = programmesDuJour.length>0 ? programmesDuJour[0].localite : '';
            let progText = programmesDuJour.length>0 ? (programmesDuJour.length>1 ? `${programmesDuJour.length} prog.` : programmesDuJour[0].programme) : '';

            html += `<div class="case-jour" onclick="showProgramsForDate('${curDate}')">`;
            html += `<span class="numero-jour">${d}</span>`;
            if (paysDuJour) {
                html += `<div class="jour-contenu">`;
                html += flagHtml;
                if (localite) html += `<div class="jour-localite">${localite.substring(0,12)}</div>`;
                if (progText) html += `<div class="jour-programme">${progText.substring(0,12)}</div>`;
                html += `</div>`;
            }
            html += `</div>`;
        }

        let totalCases = joursPrev + dernier.getDate();
        let reste = 42 - totalCases;
        for (let i=1; i<=reste; i++) {
            html += `<div class="case-jour autre-mois"><span class="numero-jour">${i}</span></div>`;
        }
        document.getElementById('calendrierGrille').innerHTML = html;
    }

    // Afficher tous les programmes d'une date
    window.showProgramsForDate = function(dateStr) {
        let d = new Date(dateStr);
        let programmes = flatPrograms.filter(p => p.date.toDateString()===d.toDateString() && !isPastProgram(p));
        let modal = document.getElementById('dateProgramsModal');
        let daySpan = document.getElementById('modalDateDay');
        daySpan.innerText = d.toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'});

        let listDiv = document.getElementById('modalProgramsList');
        listDiv.innerHTML = '';

        if (programmes.length===0) {
            let dateKey = d.toISOString().split('T')[0];
            if (countryByDate.has(dateKey)) {
                listDiv.innerHTML = `<div style="padding:20px; text-align:center;">Aucun programme public, mais le groupe est en ${countryByDate.get(dateKey)}</div>`;
            } else {
                listDiv.innerHTML = '<div style="padding:20px; text-align:center;">Aucun programme public ce jour</div>';
            }
        } else {
            programmes.forEach(p => {
                let card = document.createElement('div');
                card.className = 'modal-program-card';
                card.onclick = () => {
                    closeDateModal();
                    openDetailModal(p);
                };
                card.innerHTML = `
                    <div style="font-weight:700; color:#0a4b7a;">${p.heures ? p.heures : 'horaire ?'}</div>
                    <div style="font-weight:600;">📍 ${p.localite}</div>
                    <div style="color:#f15a24;">🏛️ ${p.lieu || 'Lieu?'}</div>
                    <div style="margin-top:6px;"><span class="programme-text">${getEmoji(p.programme)} ${p.programme}</span></div>
                `;
                listDiv.appendChild(card);
            });
        }
        modal.style.display = 'flex';
    };

    window.closeDateModal = function() {
        document.getElementById('dateProgramsModal').style.display = 'none';
    };

    // Modal détail d'un programme
    window.openDetailModal = function(p) {
        let modal = document.getElementById('programDetailModal');
        let title = document.getElementById('detailModalTitle');
        title.innerText = p.localite + ' · ' + p.pays;
        let body = document.getElementById('detailModalBody');

        let locHtml = '';
        if (p.localisation) locHtml = `<div class="modal-detail-row"><span class="modal-icon">🔗</span><span class="modal-info">${formatLink(p.localisation, p.localisation.substring(0,40))}</span></div>`;
        else if (p.coords) {
            let m = p.coords.match(/([-+]?\d+\.\d+)[,\s]+([-+]?\d+\.\d+)/);
            if (m) {
                let url = `https://www.google.com/maps?q=${m[1]},${m[2]}`;
                locHtml = `<div class="modal-detail-row"><span class="modal-icon">🗺️</span><span class="modal-info"><a href="${url}" target="_blank">Google Maps</a> · <a href="https://www.openstreetmap.org/?mlat=${m[1]}&mlon=${m[2]}#map=15/${m[1]}/${m[2]}" target="_blank">OSM</a><br><small>${m[1]}, ${m[2]}</small> <i class="fas fa-copy copy-icon" onclick="copyText('${url}', event)"></i></span></div>`;
            }
        }
        let siteHtml = p.site ? `<div class="modal-detail-row"><span class="modal-icon">🌐</span><span class="modal-info">${formatLink(p.site, p.site.substring(0,40))}</span></div>` : '';

        body.innerHTML = `
            <div class="modal-detail-row"><span class="modal-icon">📅</span><span class="modal-info">${p.dateStr} · ${p.heures || 'horaire non communiqué'}</span></div>
            <div class="modal-detail-row"><span class="modal-icon">🏷️</span><span class="modal-info"><strong>${p.programme}</strong></span></div>
            <div class="modal-detail-row"><span class="modal-icon">📍</span><span class="modal-info"><strong>${p.lieu || 'Lieu non précisé'}</strong>${p.adresse ? '<br>'+p.adresse : ''}</span></div>
            ${locHtml}
            ${siteHtml}
            <hr>
            <div class="modal-detail-row"><span class="modal-icon">ℹ️</span><span class="modal-info">Événement public</span></div>
        `;
        modal.style.display = 'flex';
    };

    window.closeDetailModal = function() {
        document.getElementById('programDetailModal').style.display = 'none';
    };

    // Navigation calendrier
    document.getElementById('prevMonthBtn').addEventListener('click', ()=>{
        currentCalMonth.setMonth(currentCalMonth.getMonth()-1);
        renderCalendrier(currentCalMonth);
    });
    document.getElementById('nextMonthBtn').addEventListener('click', ()=>{
        currentCalMonth.setMonth(currentCalMonth.getMonth()+1);
        renderCalendrier(currentCalMonth);
    });

    // 3 PROCHAINS (version verticale dans le panneau de droite)
    function renderNextThree() {
        let upcoming = flatPrograms.filter(p => !isPastProgram(p)).slice(0,3);
        let container = document.getElementById('nextCardsContainer');
        let panel = document.getElementById('nextThreePanel');
        if (upcoming.length===0) { panel.style.display='none'; return; }
        panel.style.display='block';
        container.innerHTML = '';
        upcoming.forEach(p => {
            let card = document.createElement('div');
            card.className = 'next-card';
            card.onclick = ()=>openDetailModal(p);
            let locDisplay = p.lieu || 'Lieu à préciser';
            if (p.localisation) {
                let shortLoc = p.localisation.length>30 ? p.localisation.substring(0,27)+'…' : p.localisation;
                locDisplay += ` · <span style="color:#1e6f9f;">${shortLoc}</span>`;
            } else if (p.coords) {
                locDisplay += ` · <span style="color:#1e6f9f;">coordonnées</span>`;
            }
            card.innerHTML = `<div class="next-date">📅 ${p.dateStr} · ${p.heures || ''}</div>
                <div class="next-localite">📍 ${p.localite||'?'}</div>
                <div class="next-lieu" style="font-size:0.8rem;">${locDisplay}</div>
                <div style="margin-top:8px;"><span class="programme-text">${getEmoji(p.programme)} ${p.programme}</span></div>`;
            container.appendChild(card);
        });
    }

    // RENDU PAYS (4 par ligne)
    function renderCountries() {
        let container = document.getElementById('programmesPublic');
        if (!container) return;
        if (uniqueCountries.length===0) { container.innerHTML = '<div style="padding:40px; text-align:center;">Aucun programme à venir.</div>'; return; }

        let html = '';
        uniqueCountries.forEach(pays => {
            let programmes = programsByCountry[pays].filter(p => !isPastProgram(p));
            if (programmes.length===0) return;
            let flagClass = COUNTRY_FLAG_CLASS[pays]||'flag-fr';
            let paysDisplay = pays.charAt(0)+pays.slice(1).toLowerCase();

            html += `<div class="country-block" data-pays="${pays}" id="block-${pays}">`;
            html += `<div class="country-header">`;
            html += `<div class="country-flag-large ${flagClass}"></div>`;
            html += `<span class="country-name">${paysDisplay}</span>`;
            html += `<span class="country-stats"><i class="far fa-calendar-alt"></i> ${programmes.length} programme${programmes.length>1?'s':''}</span>`;
            html += `<button class="toggle-btn" onclick="toggleCountry('${pays}')" id="toggle-${pays}"><i class="fas fa-eye"></i> Afficher</button>`;
            html += `</div>`;
            html += `<div class="program-list" id="list-${pays}" style="display: none;">`;
            programmes.forEach(p => {
                let emoji = getEmoji(p.programme);
                let lieuAffiche = p.lieu || p.localisation || 'Lieu à préciser';
                if (lieuAffiche.length>40) lieuAffiche = lieuAffiche.slice(0,37)+'…';
                let locDisplay = '';
                if (p.localisation) {
                    let short = p.localisation.length>25 ? p.localisation.substring(0,22)+'…' : p.localisation;
                    locDisplay = `<div><i class="fas fa-map"></i> ${formatLink(p.localisation, short)}</div>`;
                } else if (p.coords) {
                    let m = p.coords.match(/([-+]?\d+\.\d+)[,\s]+([-+]?\d+\.\d+)/);
                    if (m) {
                        let lat = m[1].substring(0,6), lng = m[2].substring(0,6);
                        let url = `https://www.google.com/maps?q=${m[1]},${m[2]}`;
                        locDisplay = `<div><i class="fas fa-map-marker-alt"></i> <a href="${url}" target="_blank">${lat}, ${lng}</a> <i class="fas fa-copy copy-icon" onclick="copyText('${url}', event)"></i></div>`;
                    }
                }
                html += `<div class="program-card" onclick='openDetailModal(${JSON.stringify(p).replace(/'/g,"\\'").replace(/"/g,"&quot;")})'>`;
                html += `<div class="program-date-badge"><i class="far fa-calendar"></i> ${p.dateStr} ${p.heures ? '· '+p.heures : ''}</div>`;
                html += `<div class="program-localite"><i class="fas fa-map-pin"></i> ${p.localite||'?'}</div>`;
                if (p.lieu) html += `<div class="program-lieu"><i class="fas fa-location-dot"></i> ${lieuAffiche}</div>`;
                if (locDisplay) html += locDisplay;
                html += `<div class="program-type-emojis"><span class="programme-text">${emoji} ${p.programme}</span></div>`;
                html += `</div>`;
            });
            html += `</div></div>`;
        });
        container.innerHTML = html;
    }

    function formatLink(text, label) {
        if (!text) return '';
        let url = text.match(/^https?:\/\//) ? text : 'https://www.google.com/search?q='+encodeURIComponent(text);
        return `<span><a href="${url}" target="_blank">${label||text.substring(0,30)}</a> <i class="fas fa-copy copy-icon" onclick="copyText('${url}', event)"></i></span>`;
    }

    window.toggleCountry = function(pays) {
        let list = document.getElementById('list-'+pays);
        let btn = document.getElementById('toggle-'+pays);
        if (!list || !btn) return;
        if (list.style.display === 'none' || list.style.display === '') {
            list.style.display = 'grid';
            btn.innerHTML = '<i class="fas fa-eye-slash"></i> Masquer';
        } else {
            list.style.display = 'none';
            btn.innerHTML = '<i class="fas fa-eye"></i> Afficher';
        }
    };

    window.copyText = function(text, ev) { ev.stopPropagation(); navigator.clipboard.writeText(text).then(()=>alert('📋 Copié!')); };

    // Fermer les modales en cliquant à l'extérieur
    window.onclick = function(e) {
        if (e.target.classList.contains('modal')) {
            e.target.style.display = 'none';
        }
    };

    loadData();
})();
</script>
</body>
</html>
