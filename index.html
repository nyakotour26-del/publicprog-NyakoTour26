<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>TOURNÉE NY AKO EUROPE 2026</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        /* Tous les styles précédents restent identiques */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f4f7fb; color: #1e293b; padding: 16px; min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; }
        
        /* Header avec photo style polaroid */
        .header-polaroid {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }
        .polaroid-frame {
            background: white;
            padding: 12px 12px 30px 12px;
            border-radius: 8px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2), 0 0 0 1px rgba(255,255,255,0.5), inset 0 0 0 1px rgba(0,0,0,0.1);
            transform: rotate(-1deg);
            max-width: 500px;
            width: 100%;
            margin-bottom: 15px;
            transition: transform 0.3s;
        }
        .polaroid-frame:hover {
            transform: rotate(0.5deg) translateY(-5px);
        }
        .polaroid-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 4px;
            display: block;
        }
        .polaroid-caption {
            text-align: center;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #2d3748;
            font-size: 1.2rem;
        }
        h1 { 
            font-size: 2.2rem; 
            font-weight: 800; 
            background: linear-gradient(145deg, #0f2b4b, #1e3a6f); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            letter-spacing: -0.02em;
            margin-top: 5px;
        }
        .subhead { font-size: 1rem; color: #5b6e8c; margin-top: 6px; }

        .flags-strip { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 20px 0 10px; }
        .flag-mini { width: 36px; height: 24px; border-radius: 4px; box-shadow: 0 3px 8px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .flag-mini:hover { transform: scale(1.1); }
        .flag-fr { background: linear-gradient(to right, #002395 33.3%, #fff 33.3%, #fff 66.6%, #ED2939 66.6%); }
        .flag-de { background: linear-gradient(to bottom, #000 33.3%, #DD0000 33.3%, #DD0000 66.6%, #FFCE00 66.6%); }
        .flag-be { background: linear-gradient(to right, #000 33.3%, #FAE042 33.3%, #FAE042 66.6%, #ED2939 66.6%); }
        .flag-ch { background: #D52B1E; position: relative; }
        .flag-ch::before, .flag-ch::after { content:''; position:absolute; background:#fff; }
        .flag-ch::before { width: 20px; height: 5px; top:9px; left:8px; }
        .flag-ch::after { width: 5px; height: 20px; top:2px; left:15px; }
        .flag-uk { background: #012169; position:relative; }
        .flag-uk::before, .flag-uk::after { content:''; position:absolute; background:#fff; }
        .flag-uk::before { width:36px; height:4px; top:10px; left:0; }
        .flag-uk::after { width:4px; height:24px; top:0; left:16px; }
        .flag-wales { background: #fff; position:relative; overflow:hidden; }
        .flag-wales::before { content:''; position:absolute; inset:0; background: linear-gradient(135deg, #fff 50%, #D21034 50%); }
        .flag-mada { background: #fff; position:relative; }
        .flag-mada::before { content:''; position:absolute; left:0; top:0; width:33%; height:100%; background:#FC3D32; }
        .flag-mada::after { content:''; position:absolute; left:0; bottom:0; width:33%; height:50%; background:#007E3A; }

        /* DISPOSITION RESPONSIVE : côte à côte à partir de 900px */
        .top-row { display: flex; flex-direction: column; gap: 24px; margin-bottom: 30px; }
        @media (min-width: 900px) { .top-row { flex-direction: row; } }

        .calendrier-panel {
            flex: 1 1 50%;
            background: white;
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 15px 30px -10px rgba(0,50,80,0.15);
            border: 1px solid rgba(0,80,150,0.1);
            min-width: 280px;
            position: relative;
            overflow: hidden;
        }
        /* Fond photo plus visible */
        .calendrier-panel::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?ixlib=rb-4.0.3&auto=format&fit=crop&w=2070&q=80');
            background-size: cover;
            background-position: center 30%;
            opacity: 0.25;
            pointer-events: none;
            z-index: 0;
        }
        .calendrier-panel > * {
            position: relative;
            z-index: 1;
        }

        .next-three-panel {
            flex: 1 1 40%;
            background: linear-gradient(145deg, #ffffff, #f2f6fd);
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 15px 30px -10px rgba(0,55,100,0.15);
            border: 1px solid rgba(0,90,150,0.1);
            min-width: 280px;
        }
        .next-three-panel h2 { 
            font-size: 1.4rem; 
            margin-bottom: 16px; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            color: #163a5f; 
        }

        .calendrier-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .mois-annee { font-weight: 800; font-size: 1.3rem; color: #1e3f64; }
        .btn-nav {
            background: #e7effa;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            color: #255f91;
            transition: 0.2s;
        }
        .btn-nav:hover { background: #d0e2f5; }
        .calendrier-grille {
            display: grid;
            grid-template-columns: repeat(7,1fr);
            gap: 6px;
        }
        .jour-nom {
            text-align: center;
            font-weight: 700;
            color: #6b7c93;
            font-size: 0.8rem;
            padding: 6px 0;
        }
        .case-jour {
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(2px);
            border-radius: 16px;
            padding: 8px 4px;
            min-height: 80px;
            border: 1px solid rgba(255,255,255,0.3);
            transition: 0.1s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.7rem;
            position: relative;
        }
        .case-jour:hover { background: rgba(255,255,255,0.85); border-color: #a1c4e5; }
        .case-jour.autre-mois { opacity: 0.3; background: rgba(240,240,240,0.3); }
        .numero-jour { font-weight: 700; font-size: 0.85rem; margin-bottom: 2px; }

        .jour-localite {
            font-weight: 600;
            color: #166b8f;
            font-size: 0.65rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80px;
            margin-top: 2px;
        }
        .jour-programme {
            color: #f97316;
            font-weight: 500;
            font-size: 0.6rem;
            background: rgba(255,240,229,0.9);
            border-radius: 10px;
            padding: 2px 6px;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80px;
        }
        .mini-flag { width: 18px; height: 12px; border-radius: 2px; display: inline-block; margin: 2px auto; }

        /* 3 prochains cards (vertical) */
        .next-cards-vertical { display: flex; flex-direction: column; gap: 14px; }
        .next-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 5px 12px rgba(0,0,0,0.03);
            border: 1px solid #d9e5f0;
            transition: 0.15s;
            cursor: pointer;
            position: relative;
        }
        .next-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,90,150,0.1); background: #fafdff; }
        .next-date { 
            font-weight: 700; 
            color: #1e5b9c; 
            background: #e2ecfb; 
            padding: 4px 10px; 
            border-radius: 30px; 
            display: inline-block; 
            margin-bottom: 8px; 
            font-size:0.85rem;
        }
        .next-localite { font-weight: 800; font-size: 1.1rem; color: #0b2b4a; }
        .next-lieu { color: #f15a24; font-weight: 600; font-size: 0.85rem; }
        
        /* Compteur J-xxx */
        .j-counter {
            position: absolute;
            top: 12px;
            right: 16px;
            background: #f97316;
            color: white;
            font-weight: 800;
            font-size: 0.9rem;
            padding: 4px 12px;
            border-radius: 30px;
            box-shadow: 0 2px 8px rgba(249,115,22,0.3);
            border: 2px solid white;
        }

        /* pays blocks avec couleurs et emojis personnalisés */
        .programs-grid { display: flex; flex-direction: column; gap: 24px; margin: 30px 0; }
        .country-block { 
            background: white; 
            border-radius: 24px; 
            padding: 20px 18px; 
            box-shadow: 0 12px 30px -8px rgba(0,20,40,0.15); 
            border-left: 6px solid; 
            transition: transform 0.2s;
        }
        .country-block:hover { transform: translateY(-3px); }
        .country-block[data-pays="SUISSE"] { border-left-color: #D52B1E; background: linear-gradient(to right, #fff, #fff5f5); }
        .country-block[data-pays="FRANCE"] { border-left-color: #002395; background: linear-gradient(to right, #fff, #f0f5ff); }
        .country-block[data-pays="ALLEMAGNE"] { border-left-color: #000; background: linear-gradient(to right, #fff, #f5f5f5); }
        .country-block[data-pays="BELGIQUE"] { border-left-color: #FDDA25; background: linear-gradient(to right, #fff, #fffceb); }
        .country-block[data-pays="WALES"] { border-left-color: #D21034; background: linear-gradient(to right, #fff, #fff5f5); }
        .country-block[data-pays="ANGLETERRE"] { border-left-color: #012169; background: linear-gradient(to right, #fff, #eef5ff); }
        .country-block[data-pays="MADAGASCAR"] { border-left-color: #FC3D32; background: linear-gradient(to right, #fff, #fff5f5); }

        .country-header { 
            display: flex; 
            align-items: center; 
            gap: 16px; 
            margin-bottom: 20px; 
            flex-wrap: wrap; 
            background: rgba(255,255,255,0.7);
            padding: 10px 15px;
            border-radius: 60px;
        }
        .country-flag-large { width: 50px; height: 35px; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .country-name { 
            font-size: 1.8rem; 
            font-weight: 800; 
            letter-spacing: -0.02em; 
            color: #0b1f33;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .country-emoji { font-size: 1.8rem; }
        .country-stats { 
            margin-left: auto; 
            background: #eef2f6; 
            padding: 6px 16px; 
            border-radius: 40px; 
            font-size: 0.9rem; 
            font-weight: 600; 
            color: #1e3a6f; 
        }

        .toggle-btn {
            background: #2270b0;
            border: none;
            border-radius: 40px;
            padding: 8px 22px;
            font-weight: 700;
            font-size: 0.9rem;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(30,100,170,0.3);
            transition: 0.2s;
        }
        .toggle-btn:hover { background: #1b5d94; transform: scale(1.02); }

        /* Grille par défaut : 4 colonnes desktop */
        .program-list {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        .program-card {
            border-radius: 20px;
            padding: 16px;
            border: 1px solid;
            transition: 0.15s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .program-card:hover { transform: translateY(-4px); box-shadow: 0 12px 25px -8px rgba(0,55,120,0.2); }
        
        /* Couleurs par pays pour les cartes */
        .country-SUISSE .program-card { background: #fff5f5; border-color: #D52B1E; }
        .country-FRANCE .program-card { background: #f0f5ff; border-color: #002395; }
        .country-ALLEMAGNE .program-card { background: #f5f5f5; border-color: #000; }
        .country-BELGIQUE .program-card { background: #fffceb; border-color: #FDDA25; }
        .country-WALES .program-card { background: #fff5f5; border-color: #D21034; }
        .country-ANGLETERRE .program-card { background: #eef5ff; border-color: #012169; }
        .country-MADAGASCAR .program-card { background: #fff5f5; border-color: #FC3D32; }

        .program-date-badge { 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            font-weight: 700; 
            color: #0a4b7a; 
            background: rgba(255,255,255,0.8); 
            padding: 5px 12px; 
            border-radius: 30px; 
            width: fit-content; 
            font-size: 0.8rem; 
            border: 1px solid #cbd5e0;
        }
        .program-localite { font-weight: 700; font-size: 1.1rem; color: #122b44; }
        .program-lieu { 
            color: #f15a24; 
            font-weight: 600; 
            font-size: 0.9rem; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            background: rgba(255,255,255,0.8); 
            padding: 5px 10px; 
            border-radius: 40px; 
            width: fit-content; 
            border: 1px solid #fecaca;
        }
        .programme-text { 
            font-weight: 600; 
            color: #f97316; 
            font-size: 0.9rem; 
            background: rgba(255,255,255,0.8); 
            padding: 4px 12px; 
            border-radius: 30px; 
            display: inline-block; 
            border: 1px solid #fed7aa;
        }
        .localisation-link { color: #1e6f9f; font-size: 0.8rem; text-decoration: underline dotted; cursor: pointer; word-break: break-all; }
        .copy-icon { margin-left: 6px; color: #7e93a8; font-size: 0.7rem; cursor: pointer; }
        .copy-icon:hover { color: #2b6f9e; }

        footer { margin-top: 50px; text-align: center; color: #8094a8; font-size: 0.85rem; border-top: 1px solid #dce5ed; padding-top: 25px; }

        /* MODAL pour les détails d'une date (multi-programmes) */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; max-width: 600px; width: 90%; border-radius: 28px; padding: 24px; box-shadow: 0 30px 50px rgba(0,0,0,0.3); max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e7edf4; padding-bottom: 14px; margin-bottom: 20px; }
        .modal-header h3 { font-weight: 800; color: #1e293b; }
        .close-btn { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #7c8ba0; }
        .modal-program-card {
            background: #f9fbfe;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 12px;
            border-left: 4px solid #f97316;
            cursor: pointer;
        }
        .modal-program-card:hover { background: #fff4e6; }

        .modal-loc { font-size: 0.75rem; color: #1e6f9f; margin-top: 4px; word-break: break-word; }

        /* ===== CORRECTIONS SPÉCIFIQUES POUR 768px ===== */
        @media (max-width: 768px) {
            .calendrier-grille { gap: 3px; }
            .case-jour { 
                min-height: 70px; 
                padding: 4px 2px;
                font-size: 0.65rem;
                background: rgba(255,255,255,0.5);
            }
            .jour-localite { 
                font-size: 0.6rem; 
                max-width: 60px;
            }
            .jour-programme { 
                font-size: 0.55rem; 
                max-width: 60px;
                padding: 1px 3px;
            }
            .mini-flag { width: 16px; height: 10px; }
            .next-three-panel { padding: 16px; }
            .next-card { padding: 12px; }
            .next-localite { font-size: 1rem; }
            .j-counter { font-size: 0.8rem; padding: 3px 10px; }
            .country-header { gap: 10px; }
            .country-flag-large { width: 40px; height: 28px; }
            .country-name { font-size: 1.5rem; }
            .country-stats { font-size: 0.8rem; padding: 4px 12px; }
            .toggle-btn { padding: 6px 16px; font-size: 0.8rem; }
            .program-list { 
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 10px;
            }
            .program-card { padding: 12px; }
        }

        @media (max-width: 480px) {
            .program-list { grid-template-columns: repeat(2, 1fr) !important; }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Header avec photo polaroid - VOTRE IMAGE S'AFFICHE ICI -->
    <div class="header-polaroid">
        <div class="polaroid-frame">
            <!-- L'URL ci-dessous est celle qui fonctionnait dans votre code -->
            <img class="polaroid-img" src="https://drive.google.com/thumbnail?id=193k18u5i7g3JvpQWTK4xFoi7uzJl1vhI&sz=w800" alt="Tournée Europe">
            <div class="polaroid-caption">✨ Toutes nos sources sont en Toi ✨</div>
        </div>
        <h1>🇪🇺 TOURNÉE NY AKO EUROPE 2026</h1>
        <div class="subhead">Tous les programmes ouverts • mise à jour automatique</div>
        <div class="flags-strip">
            <div class="flag-mini flag-ch" title="Suisse"></div>
            <div class="flag-mini flag-fr" title="France"></div>
            <div class="flag-mini flag-de" title="Allemagne"></div>
            <div class="flag-mini flag-be" title="Belgique"></div>
            <div class="flag-mini flag-uk" title="Angleterre"></div>
            <div class="flag-mini flag-wales" title="Wales"></div>
            <div class="flag-mini flag-mada" title="Madagascar"></div>
        </div>
    </div>

    <!-- RANGÉE HAUTE : CALENDRIER + 3 PROGRAMMES LES PLUS PROCHES -->
    <div class="top-row">
        <div class="calendrier-panel">
            <div class="calendrier-header">
                <button class="btn-nav" id="prevMonthBtn"><i class="fas fa-chevron-left"></i></button>
                <span class="mois-annee" id="moisAnnee">Avril 2026</span>
                <button class="btn-nav" id="nextMonthBtn"><i class="fas fa-chevron-right"></i></button>
            </div>
            <div class="calendrier-grille" id="calendrierGrille"></div>
        </div>

        <div class="next-three-panel" id="nextThreePanel">
            <h2><i class="fas fa-hourglass-half"></i> 3 programmes les plus proches</h2>
            <div id="nextCardsContainer" class="next-cards-vertical"></div>
        </div>
    </div>

    <!-- LISTE PAYS -->
    <div id="programmesPublic" class="programs-grid"></div>

    <footer><i class="fas fa-music"></i> Données extraites automatiquement · version grand public</footer>
</div>

<!-- MODAL MULTI-PROGRAMMES POUR UNE DATE -->
<div id="dateProgramsModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalDateTitle">Programmes du <span id="modalDateDay"></span></h3>
            <button class="close-btn" onclick="closeDateModal()"><i class="fas fa-times"></i></button>
        </div>
        <div id="modalProgramsList"></div>
    </div>
</div>

<!-- MODAL DÉTAIL D'UN PROGRAMME (individuel) -->
<div id="programDetailModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="detailModalTitle">Détail du programme</h3>
            <button class="close-btn" onclick="closeDetailModal()"><i class="fas fa-times"></i></button>
        </div>
        <div id="detailModalBody"></div>
    </div>
</div>

<script>

</body>
